      function taskSourceChannelMatches(row, sourceChannelId, accounts = []) {
        if (!sourceChannelId || sourceChannelId === "all") return true;
        const requestedId = String(sourceChannelId);
        const taskChannelId = String(row?.channelId || "");
        if (taskChannelId === requestedId || taskChannelId.startsWith(`${requestedId}:`)) return true;
        const account = accounts.find((item) => String(item?.id || "") === String(row?.accountId || ""));
        return String(account?.channelId || "") === requestedId;
      }

      function dateKeyInShanghai(value) {
        const date = new Date(value || Date.now());
        if (!Number.isFinite(date.getTime())) return "";
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(date);
      }

      function taskTime(row) {
        if (Number.isFinite(Number(row?.time))) return Number(row.time);
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(row?.day || ""))) {
          return Date.parse(`${row.day}T12:00:00+08:00`);
        }
        const time = Date.parse(row?.createdAt || row?.completedAt || row?.updatedAt || "");
        return Number.isFinite(time) ? time : 0;
      }

      function taskGeneratedImageCount(row) {
        if (Number.isFinite(Number(row?.successImages))) return Number(row.successImages);
        const urls = Array.isArray(row?.imageUrls) ? row.imageUrls.filter(Boolean).length : 0;
        if (urls) return urls;
        if (row?.status === "success" && row?.taskType !== "chat") return numberValue(row.imageCount);
        return 0;
      }

      function taskRecordCount(row) {
        const value = row?.tasks;
        return Math.max(0, numberValue(value === undefined || value === null ? 1 : value));
      }

      function failedTaskRecordCount(row) {
        const value = row?.failedTasks;
        return Math.max(0, numberValue(value === undefined || value === null ? taskRecordCount(row) : value));
      }

      function summarizeTaskRange(source, predicate) {
        const items = source.filter(predicate);
        return {
          tasks: items.reduce((sum, item) => sum + taskRecordCount(item), 0),
          successTasks: items.reduce((sum, item) => (
            sum + (item.status === "success" ? taskRecordCount(item) : 0)
          ), 0),
          successImages: items.reduce((sum, item) => sum + (item.status === "success" ? taskGeneratedImageCount(item) : 0), 0),
          failedTasks: items.reduce((sum, item) => (
            sum + (item.status === "failed" ? failedTaskRecordCount(item) : 0)
          ), 0)
        };
      }

      function summarizeTasks(source) {
        const now = Date.now();
        const todayKey = dateKeyInShanghai(now);
        const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
        return {
          today: summarizeTaskRange(source, (item) => dateKeyInShanghai(taskTime(item)) === todayKey),
          week: summarizeTaskRange(source, (item) => taskTime(item) >= sevenDaysAgo)
        };
      }

      function taskTrendData(daily, rangeDays, accountFilter, sourceChannelFilter, channelFilter, accounts) {
        const days = Array.isArray(daily?.days) ? daily.days.slice(-rangeDays) : [];
        const visibleDays = new Set(days);
        const totals = new Map(days.map((day) => [day, { day, tasks: 0, successTasks: 0, successImages: 0, failedTasks: 0 }]));
        const records = Array.isArray(daily?.records) ? daily.records : [];
        records.forEach((record) => {
          if (!visibleDays.has(record.day)) return;
          if (accountFilter !== "all" && record.accountId !== accountFilter) return;
          if (!taskSourceChannelMatches(record, sourceChannelFilter, accounts)) return;
          if (channelFilter !== "all" && record.channelGroup !== channelFilter) return;
          const current = totals.get(record.day);
          current.tasks += numberValue(record.tasks);
          current.successTasks += numberValue(record.successTasks);
          current.successImages += numberValue(record.successImages);
          current.failedTasks += numberValue(record.failedTasks);
        });
        return [...totals.values()];
      }

      function summarizeTrendRows(rows = []) {
        return rows.reduce((summary, row) => ({
          tasks: summary.tasks + numberValue(row.tasks),
          successTasks: summary.successTasks + numberValue(row.successTasks),
          successImages: summary.successImages + numberValue(row.successImages),
          failedTasks: summary.failedTasks + numberValue(row.failedTasks)
        }), { tasks: 0, successTasks: 0, successImages: 0, failedTasks: 0 });

        return `${Number.isInteger(rounded) ? rounded.toFixed(0) : rounded.toFixed(1)}%`;
      }

      function productivityDayData(daily, accounts, day) {
        const rows = new Map();
        let systemRejectedTasks = 0;
        (Array.isArray(accounts) ? accounts : []).forEach((account) => {
          rows.set(String(account.id), {
            id: String(account.id),
            name: account.name || account.username || account.id || "未命名账号",
            tasks: 0,
            successTasks: 0,
            failedTasks: 0,
            successImages: 0,
            durationMsTotal: 0,
            durationSamples: 0
          });
        });
        (Array.isArray(daily?.records) ? daily.records : []).forEach((record) => {
          if (record.day !== day) return;
          systemRejectedTasks += numberValue(record.systemRejectedTasks);
          const accountKey = String(record.accountId || record.accountName || "").trim();
          if (!accountKey && numberValue(record.tasks) <= 0) return;
          const id = accountKey || "unknown";
          const current = rows.get(id) || {
            id,
            name: record.accountName || record.accountId || "未知账号",
            tasks: 0,
            successTasks: 0,
            failedTasks: 0,
            successImages: 0,
            durationMsTotal: 0,
            durationSamples: 0
          };
          current.tasks += numberValue(record.tasks);
          current.successTasks += numberValue(record.successTasks);
          current.failedTasks += numberValue(record.failedTasks);
          current.successImages += numberValue(record.successImages);
          current.durationMsTotal += numberValue(record.durationMsTotal);
          current.durationSamples += numberValue(record.durationSamples);
          rows.set(id, current);
        });
        const list = [...rows.values()];
        const totalImages = list.reduce((sum, row) => sum + row.successImages, 0);
        const totalTasks = list.reduce((sum, row) => sum + row.tasks, 0);
        const totalFailed = list.reduce((sum, row) => sum + row.failedTasks, 0);
        const durationMsTotal = list.reduce((sum, row) => sum + row.durationMsTotal, 0);
        const durationSamples = list.reduce((sum, row) => sum + row.durationSamples, 0);
        const activeAccounts = list.filter((row) => row.tasks > 0).length;
        return {
          day,
          totalImages,
          totalTasks,
          totalFailed,
          systemRejectedTasks,
          activeAccounts,
          averagePerAccount: activeAccounts ? totalImages / activeAccounts : 0,
          averageDurationMs: durationSamples ? durationMsTotal / durationSamples : null,
          rows: list
            .map((row) => ({
              ...row,
              share: totalImages ? row.successImages / totalImages : 0,
              successRate: row.tasks ? row.successTasks / row.tasks : 0,
              averageDurationMs: row.durationSamples ? row.durationMsTotal / row.durationSamples : null
            }))
            .sort((a, b) => b.successImages - a.successImages || b.tasks - a.tasks || a.name.localeCompare(b.name, "zh-CN"))
        };
      }

      function productivityTrendData(daily, concurrency, rangeDays) {
        const days = Array.isArray(daily?.days) ? daily.days.slice(-rangeDays) : [];
        const visibleDays = new Set(days);
        const totals = new Map(days.map((day) => [day, {
          day,
          totalImages: 0,
          durationMsTotal: 0,
          durationSamples: 0,
          activeAccountIds: new Set()
        }]));
        (Array.isArray(daily?.records) ? daily.records : []).forEach((record) => {
          if (!visibleDays.has(record.day)) return;
          const current = totals.get(record.day);
          current.totalImages += numberValue(record.successImages);
          current.durationMsTotal += numberValue(record.durationMsTotal);
          current.durationSamples += numberValue(record.durationSamples);
          if (numberValue(record.tasks) > 0) current.activeAccountIds.add(record.accountId || record.accountName || "unknown");
        });
        const concurrencyByDay = new Map((Array.isArray(concurrency?.days) ? concurrency.days : []).map((item) => [item.day, item]));
        return [...totals.values()].map((row) => {
          const activeAccounts = row.activeAccountIds.size;
          const runtime = concurrencyByDay.get(row.day);
          return {
            day: row.day,
            totalImages: row.totalImages,
            activeAccounts,
            averagePerAccount: activeAccounts ? Number((row.totalImages / activeAccounts).toFixed(1)) : 0,

            averageRunning: runtime?.samples ? numberValue(runtime.averageRunning) : null,

      function channelSuccessRateTrendData(daily, rangeDays) {
        const days = Array.isArray(daily?.days) ? daily.days.slice(-rangeDays) : [];
        const visibleDays = new Set(days);
        const channelKeys = new Set();
        const rows = new Map(days.map((day) => [day, { day, channels: {} }]));

        (Array.isArray(daily?.records) ? daily.records : []).forEach((record) => {
          if (!visibleDays.has(record.day)) return;
          const channelGroup = record.channelGroup || "other";
          const current = rows.get(record.day);
          const channel = current.channels[channelGroup] || {
            successTasks: 0,
            failedTasks: 0,
            totalTasks: 0,
            rate: null
          };
          const successTasks = numberValue(record.successTasks);
          const failedTasks = numberValue(record.failedTasks);
          const totalTasks = successTasks + failedTasks || numberValue(record.tasks);
          if (!totalTasks) return;
          channel.successTasks += successTasks;
          channel.failedTasks += failedTasks;
          channel.totalTasks += totalTasks;
          channel.rate = channel.totalTasks

          current.channels[channelGroup] = channel;
          channelKeys.add(channelGroup);

      function formatDuration(ms) {
        if (!Number.isFinite(ms) || ms < 0) return "-";
        const totalSeconds = Math.max(0, Math.floor(ms / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours) return `${hours}时${minutes}分${seconds}秒`;
        if (minutes) return `${minutes}分${seconds}秒`;
        return `${seconds}秒`;
      }

      function taskDuration(task, now) {
        const start = Date.parse(task.createdAt || task.raw?.created_at || "");
        if (!Number.isFinite(start)) return "-";
        const done = ["success", "failed", "cancelled", "interrupted"].includes(task.status)
          ? Date.parse(task.completedAt || task.updatedAt || "")
          : now;
        if (!Number.isFinite(done)) return "-";
        const text = formatDuration(done - start);
        return ["success", "failed", "cancelled", "interrupted"].includes(task.status) ? text : `已耗时 ${text}`;
      }

      function taskModelText(row = {}) {
        const rawModel = String(
          row.channelType === "drawing" && row.modelId !== null && row.modelId !== undefined && row.modelId !== ""
            ? row.modelId
            : row.raw?.modelFamily || row.raw?.chatModel || row.modelId || ""
        ).trim().toLowerCase();
        if (["1", "gpt", "gpt-image-2", "chatgpt-image-2"].includes(rawModel)) {
          return row.channelType === "drawing" ? "GPT / ChatGPT-Image-2" : "GPT";
        }
        if (["2", "nano-banana-pro"].includes(rawModel)) return "Gemini / Nano-Banana-Pro";
        if (["3", "nano-banana"].includes(rawModel)) return "Gemini / Nano-Banana";
        if (rawModel.includes("gemini")) return "Gemini";
        if (rawModel.includes("grok")) return "Grok";
        if (rawModel.includes("gpt")) return "GPT";
        return rawModel || "-";
      }

      function channelName(config, channelId) {
        return config?.channels?.find((item) => item.id === channelId)?.name || channelId || "-";
      }

      function getChannelStatus(channel, relatedAccounts) {
        if (channel.enabled === false) return "disabled";
        if (!relatedAccounts.length) return "empty";
        const statuses = relatedAccounts
          .filter((item) => item.enabled !== false)
          .map((item) => accountEffectiveStatus(item, channel));
        if (statuses.some((status) => status === "disconnected")) return "disconnected";
        if (statuses.some((status) => status === "error" || status === "failed")) return "error";
        if (statuses.some((status) => status === "ok")) return "ok";
        if (statuses.some((status) => status === "quota_empty")) return "quota_empty";
        return "unknown";
      }

      function chatDisplayStatus(status = {}) {
        if (confirmedChatQuotaEmpty(status)) return "quota_empty";
        if (status.status === "quota_empty") return "ok";
        return status.status || "unknown";
      }

      function aggregateChatStatus(accounts, channel) {
        const statuses = accounts
          .filter((item) => item.enabled !== false)
          .map((item) => channel?.type === "shareai" ? abilityStatus(item, "chatplus") : item);
        if (!statuses.length) return { status: "unknown" };
        const referenceUsage = aggregateChatReferenceUsage(
          accounts,
          channel?.type,
          chatModelsForChannel(channel).filter((item) => item.enabled).map((item) => item.key)
        );
        const withReferenceUsage = (status) => ({
          ...status,
          meta: {
            ...(status.meta || {}),
            referenceUsage
          }
        });
        const available = statuses.find((item) => chatDisplayStatus(item) === "ok");
        if (available) return withReferenceUsage({ ...available, status: "ok", quotaConfirmedByUpstream: false });
        const explicitEmpty = statuses.find(confirmedChatQuotaEmpty);
        if (explicitEmpty && statuses.every((item) => confirmedChatQuotaEmpty(item))) return withReferenceUsage(explicitEmpty);
        const unavailable = statuses.find((item) => ["error", "failed", "disconnected", "disabled"].includes(chatDisplayStatus(item)));
        return withReferenceUsage(unavailable || statuses[0] || { status: "unknown" });
      }

      function accountEffectiveStatus(account, channel) {
        if (account.enabled === false) return "disabled";
        if (channel?.type === "chatplus") return chatDisplayStatus(account);
        if (channel?.type !== "shareai") return account.status || "unknown";
        const statuses = [
          channelAbilityEnabled(channel, "drawing") ? abilityStatus(account, "drawing").status : "",
          channelAbilityEnabled(channel, "chatplus") ? chatDisplayStatus(abilityStatus(account, "chatplus")) : ""
        ].filter(Boolean);
        if (!statuses.length) return account.status || "unknown";
        if (statuses.includes("disconnected")) return "disconnected";
        if (statuses.some((status) => status === "error" || status === "failed")) return "error";
        if (statuses.includes("ok")) return "ok";
        if (statuses.includes("quota_empty")) return "quota_empty";
        return account.status || "unknown";
      }

      function accountCheckDisplayStatus(account, channel) {
        const status = channel?.type === "shareai"
          ? abilityStatus(account, "chatplus")
          : channel?.type === "chatplus"
            ? account
            : {};
        return status?.meta?.accountCheck?.status === "timeout" ? "check_timeout" : "";
      }

      function getChannelStats(channel, accounts) {
        const related = accounts.filter((item) => item.channelId === channel.id);
        const enabled = related.filter((item) => item.enabled !== false);
        if (channel?.type === "shareai") {
          const drawingEnabled = channelAbilityEnabled(channel, "drawing");
          const chatEnabled = channelAbilityEnabled(channel, "chatplus");
          const drawingQuota = drawingEnabled ? related.reduce((sum, item) => sum + numberValue(abilityStatus(item, "drawing").quota ?? item.quota), 0) : 0;
          const drawingBalance = drawingEnabled ? related.reduce((sum, item) => sum + numberValue(abilityStatus(item, "drawing").balance ?? item.balance ?? item.quota), 0) : 0;
          const chatStatus = chatEnabled ? aggregateChatStatus(related, channel) : { status: "unknown" };
          return {
            accountCount: related.length,
            enabledCount: enabled.length,
            okCount: related.filter((item) => accountEffectiveStatus(item, channel) === "ok").length,
            quota: drawingQuota,
            balance: drawingBalance,
            drawingQuota,
            drawingBalance,
            chatStatus,
            status: getChannelStatus(channel, related)
          };
        }
        const chatStatus = channel?.type === "chatplus"
          ? aggregateChatStatus(related, channel)
          : null;
        return {
          accountCount: related.length,
          enabledCount: enabled.length,
          okCount: related.filter((item) => accountEffectiveStatus(item, channel) === "ok").length,
          quota: related.reduce((sum, item) => sum + numberValue(item.quota), 0),
          balance: related.reduce((sum, item) => sum + numberValue(item.balance ?? item.quota), 0),
          ...(chatStatus ? { chatStatus } : {}),
          status: getChannelStatus(channel, related)
        };
      }

          statRecords.forEach((record) => {
            if (!record.accountId || (record.day || dateKeyInShanghai(record.time)) !== today) return;
            const current = usage.get(record.accountId) || { drawingImages: 0, chatImages: 0, chats: 0 };
            if (record.taskType === "chat") {
              current.chats += numberValue(record.tasks || 1);
            } else if (record.channelGroup === "chatplus") {
              current.chatImages += numberValue(record.successImages);
            } else {
              current.drawingImages += numberValue(record.successImages);
            }
            usage.set(record.accountId, current);
          });
          return usage;
        }, [statRecords]);

          if (error?.code === "REQUEST_ABORTED") return "";

        async function loadTaskPage({
          page = 1,
          append = false,
          keyword = taskKeyword,
          accountId = taskAccountFilter,
          sourceChannelId = taskSourceChannelFilter,
          channel = taskChannelFilter,
          status = taskStatusFilter,
          showLoading = true,
          background = false
        } = {}) {
          if (background && taskListRequestActive()) return null;
          const requestId = ++taskRequestIdRef.current;
          const controller = new AbortController();
          if (!background && taskListRequestActive()) taskPageAbortRef.current.abort();
          taskPageAbortRef.current = controller;
          const params = new URLSearchParams({ page: String(page), pageSize: "100" });
          if (String(keyword || "").trim()) params.set("keyword", String(keyword).trim());
          if (accountId && accountId !== "all") params.set("accountId", accountId);
          if (sourceChannelId && sourceChannelId !== "all") params.set("sourceChannelId", sourceChannelId);
          if (channel && channel !== "all") params.set("channel", channel);
          if (status && status !== "all") params.set("status", status);
          if (showLoading) setTaskListLoading(true);
          try {
            const data = await api(`/api/tasks/page?${params.toString()}`, {
              signal: controller.signal,
              timeoutMs: background ? 8000 : 15000
            });
            if (controller.signal.aborted || requestId !== taskRequestIdRef.current) return null;
            const items = Array.isArray(data?.items) ? data.items : [];
            setTasks((current) => {
              if (!append) return items;
              const seen = new Set();
              return [...current, ...items].filter((item) => {
                const id = String(item?.id || "");
                if (!id || seen.has(id)) return false;
                seen.add(id);
                return true;
              });
            });
            setTaskTotal(Math.max(0, numberValue(data?.total)));
            setTaskPage(Math.max(1, numberValue(data?.page) || 1));
            if (!String(keyword || "").trim()
              && (!accountId || accountId === "all")
              && (!sourceChannelId || sourceChannelId === "all")
              && (!channel || channel === "all")
              && (!status || status === "all")) {
              setAllTaskTotal(Math.max(0, numberValue(data?.total)));
            }
            return data;
          } catch (error) {
            if (error?.code === "REQUEST_ABORTED") return null;
            throw error;
          } finally {
            if (taskPageAbortRef.current === controller) taskPageAbortRef.current = null;
            if (showLoading && requestId === taskRequestIdRef.current) setTaskListLoading(false);
          }
        }

        useEffect(() => {
          let cancelled = false;

          const targetDay = productivityDay;
          const loadIntraday = async (showLoading = false) => {
            if (requesting) return;
            requesting = true;
            if (showLoading) setIntradayLoading(true);
            try {
              const data = await api(`/api/stats/intraday?day=${encodeURIComponent(targetDay)}`);
              if (cancelled || data?.day !== targetDay) return;
              setIntradayStats(data);
              setIntradayError(false);
              setIntradayRefreshedAt(Date.parse(data.generatedAt || "") || Date.now());
              if (Array.isArray(data.dailyRecords)) {
                setDailyStats((current) => {
                  const days = [...new Set([...(current.days || []), targetDay])].sort().slice(-31);
                  return {
                    ...current,
                    days,
                    records: [
                      ...(current.records || []).filter((record) => record.day !== targetDay),
                      ...data.dailyRecords
                    ]
                  };
                });
              }
            } catch (_error) {
              if (!cancelled) setIntradayError(true);
            } finally {
              requesting = false;
              if (!cancelled) setIntradayLoading(false);
            }
          };

          setIntradayStats({ day: targetDay, buckets: [] });
          setIntradayError(false);
          setIntradayRefreshedAt(null);
          loadIntraday(true);
          const timer = targetDay === dateKeyInShanghai(Date.now())
            ? setInterval(() => loadIntraday(false), 60_000)
            : null;
          return () => {
            cancelled = true;
            if (timer) clearInterval(timer);

        async function testChannel(channelId) {
          const related = accounts.filter((item) => item.channelId === channelId);
          if (!related.length) {
            message.warning("这个渠道还没有绑定账号");
            return;
          }
          setCheckingChannelIds((current) => current.includes(channelId) ? current : [...current, channelId]);
          let ok = 0;
          let failed = 0;
          let skipped = 0;
          for (const account of related) {
            try {
              const result = await api(`/api/accounts/${account.id}/test`, { method: "POST" });
              if (result?.checkSkipped) skipped += 1;
              else ok += 1;
            } catch (_error) {
              failed += 1;
            }
          }
          await refresh().catch(() => {});
          setCheckingChannelIds((current) => current.filter((item) => item !== channelId));
          message.info(`检测完成：${ok} 个完成，${skipped} 个使用中已跳过，${failed} 个需处理`);
        }

        function showUpdateResult(result) {
          const title = result?.success
            ? (result?.skipped ? "已经是最新版" : "更新完成")
            : (result?.skipped ? "未执行更新" : "更新未完成");
          const output = [
            result?.message ? `结果：${result.message}` : "",
            result?.stdout ? `输出：\n${result.stdout}` : "",
            result?.stderr ? `提示：\n${result.stderr}` : ""
          ].filter(Boolean).join("\n\n") || "更新命令执行完成，没有返回内容。";
          Modal.info({
            title,
            width: 760,
            okText: "知道了",
            content: h("pre", { className: "update-output" }, output)
          });
        }

        const updateMessageKey = "admin-code-update";

        function wait(milliseconds) {
          return new Promise((resolve) => setTimeout(resolve, milliseconds));
        }

        async function waitForServerRecovery() {
          for (let attempt = 0; attempt < 45; attempt += 1) {
            const ready = await withTimeout(
              fetch("/api/health", { cache: "no-store" }).then((response) => response.ok),
              2000,
              false
            );
            if (ready) {
              message.success({ key: updateMessageKey, content: "服务器已恢复，正在刷新页面", duration: 2 });
              setTimeout(() => window.location.reload(), 600);
              return true;
            }
            await wait(2000);
          }
          message.warning({ key: updateMessageKey, content: "服务器暂未恢复，请稍后手动刷新页面", duration: 6 });
          return false;
        }

        async function executeUpdate() {
          setUpdating(true);
          message.loading({ key: updateMessageKey, content: "正在后台检查更新，可继续使用页面", duration: 0 });
          try {
            const result = await api("/api/admin/update", { method: "POST", body: {}, timeoutMs: 210000 });
            if (result?.success && !result?.skipped) {
              message.loading({ key: updateMessageKey, content: "更新完成，正在等待服务器重启", duration: 0 });
              await wait(2500);
              await waitForServerRecovery();
              return;
            }
            if (result?.success) message.info({ key: updateMessageKey, content: result?.message || "已经是最新版，无需更新", duration: 4 });
            else if (result?.skipped) message.warning({ key: updateMessageKey, content: result?.message || "未执行更新", duration: 5 });
            else message.error({ key: updateMessageKey, content: result?.message || "更新失败", duration: 5 });
            showUpdateResult(result);
          } catch (error) {
            if (error?.code === "NETWORK_ERROR") {
              message.loading({ key: updateMessageKey, content: "服务器正在重启，正在自动重新连接", duration: 0 });
              await waitForServerRecovery();
            } else if (error?.code === "REQUEST_TIMEOUT") {
              message.warning({ key: updateMessageKey, content: error.message, duration: 8 });
            } else {
              message.error({ key: updateMessageKey, content: error.message, duration: 6 });
            }
          } finally {
            setUpdating(false);
          }
        }

        function runUpdate() {
          Modal.confirm({
            title: "更新线上代码",
            content: "会先检查服务器代码版本；只有发现新版本，才会执行更新命令。",
            okText: "检查并更新",
            cancelText: "取消",
            onOk: () => {
              executeUpdate();
            }

        async function submitChat(values) {
          if (chatSubmitting) return;
          if (chatSubmitBlocked) {
            message.warning(`聊天账号冷却中，约 ${accountCooldownText(coolingChatAccount)} 后再试`);
            return;
          }
          const text = String(values.message || "").trim();
          if (!text && !chatFileList.length) {
            message.warning("请输入对话内容，或上传图片");
            return;
          }
          if (chatFileList.length > 5) {
            message.warning("对话最多上传 5 张图");
            return;
          }
          setChatSubmitting(true);
          setLoading(true);
          try {
            const target = selectedTestTarget(values, "chatplus");
            if (!target.channel) {
              message.warning("这个账号不能用于对话测试。");
              return;
            }
            const headers = { Authorization: `Bearer ${config?.apiKey || ""}` };
            const body = chatFileList.length
              ? (() => {
                  const form = new FormData();
                  form.append("message", text);
                  form.append("channel", target.channel);
                  if (target.accountId) form.append("accountId", target.accountId);
                  if (values.model) form.append("model", values.model);
                  chatFileList.forEach((file) => form.append("image", file.originFileObj));
                  return form;
                })()
              : {
                  message: text,
                  channel: target.channel,
                  ...(target.accountId ? { accountId: target.accountId } : {}),
                  ...(values.model ? { model: values.model } : {})
                };
            const result = await api("/v1/chat/completions?wait=0", { method: "POST", headers, body });
            if (result.task) {
              addSubmittedTask(result.task);
            }
            await refreshRuntimeStatus();
            setChatResult("");
            message.success("对话已提交，任务记录里查看结果和耗时");
          } catch (error) {
            message.error(error.message);
          } finally {
            setChatSubmitting(false);
            setLoading(false);
          }
        }

          if (!editFileList.length) {
            message.warning("先上传 1 到 3 张源图");
            return;
          }
          if (editFileList.length > 3) {
            message.warning("图生图最多上传 3 张源图");

          setLoading(true);
          try {

            const target = usingAutoAccount && ability === "chatplus"
              ? { channel: "chatplus", accountId: "" }

            if (!target.channel) {
              message.warning("这个账号不能用于图生图测试。");
