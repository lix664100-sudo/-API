        return {
          drawing: enabled.drawing !== false,
          chatplus: enabled.chatplus !== false
        };
      }

      function channelQuotaText(channel, stats = {}) {
        if (channel?.type === "shareai") {
          const parts = [];
          if (channelAbilityEnabled(channel, "drawing")) parts.push(`绘图 ${quotaPairText(stats.drawingQuota, stats.drawingBalance)}`);
          if (channelAbilityEnabled(channel, "chatplus")) parts.push(chatQuotaText(null, channel, stats.chatStatus));
          return parts.join("｜") || "-";
        }
        if (channel?.type === "chatplus") return chatQuotaText(null, channel, stats.chatStatus);
        return quotaPairText(stats.quota, stats.balance);
      }

      function channelTypeName(type) {
        return channelTypeLabels[type] || type || "-";
      }

      function channelBaseUrl(channel) {
        if (channel?.type === "shareai") {
          const settings = channel.settings || {};
          const parts = [];
          if (channelAbilityEnabled(channel, "drawing")) parts.push(`绘图 ${settings.drawingBaseUrl || "-"}`);
          if (channelAbilityEnabled(channel, "chatplus")) parts.push(`聊天 ${settings.chatBaseUrl || "-"}`);
          return parts.join(" / ") || "-";
        }
        return channel?.settings?.baseUrl || "-";
      }

      function cloudlianRegistrationAvailable(channel) {
        if (!channel) return false;
        let value = "";
        if (channel.type === "shareai") {
          if (!channelAbilityEnabled(channel, "chatplus") || channelAbilityEnabled(channel, "drawing")) return false;
          value = channel.settings?.chatBaseUrl || "";
        } else if (channel.type === "chatplus") {
          value = channel.settings?.baseUrl || "";
        } else {
          return false;
        }
        try {
          const url = new URL(value);
          const host = url.hostname.toLowerCase();
          return url.protocol === "https:" && (host === "cloudlian.cn" || host.endsWith(".cloudlian.cn"));
        } catch {
          return false;
        }
      }

      function chatAccountActivationAvailable(channel) {
        if (!channel) return false;
        let value = "";
        if (channel.type === "shareai") {
          if (!channelAbilityEnabled(channel, "chatplus")) return false;
          value = channel.settings?.chatBaseUrl || "";
        } else if (channel.type === "chatplus") {
          value = channel.settings?.baseUrl || "";
        } else {
          return false;
        }
        try {
          return new URL(value).protocol === "https:";
        } catch {
          return false;
        }
      }

      function abilityStatus(account, key) {
        return account?.meta?.abilities?.[key] || {};
      }

      function conversationBusyFreezeText(value) {
        return /对话过快|当前有多个任务执行中|已有任务(?:正在)?(?:执行|处理)|多个任务(?:正在)?(?:执行|处理)/
          .test(String(value || ""));
      }

      function accountCarFreezes(account, channel, now = Date.now()) {
        const stored = channel?.type === "shareai"
          ? abilityStatus(account, "chatplus")?.meta?.imageCarCooldowns
          : account?.meta?.chatplusImageCarCooldowns;
        const currentTime = Number.isFinite(Number(now)) ? Number(now) : Date.now();
        return Object.values(stored && typeof stored === "object" && !Array.isArray(stored) ? stored : {})
          .map((item) => {
            const originalUntil = Date.parse(item?.cooldownUntil || "");
            const legacyBusyFreeze = item?.reason === "conversation_not_created"
              && conversationBusyFreezeText(item?.message);
            const updatedAt = Date.parse(item?.updatedAt || "");
            const correctedUntil = legacyBusyFreeze && Number.isFinite(originalUntil)
              ? Math.min(originalUntil, Number.isFinite(updatedAt) ? updatedAt + 30_000 : currentTime)
              : originalUntil;
            return { ...(item || {}), cooldownUntil: correctedUntil };
          })
          .filter((item) => String(item.carId || "").trim() && Number.isFinite(item.cooldownUntil) && item.cooldownUntil > currentTime)
          .sort((left, right) => left.cooldownUntil - right.cooldownUntil);
      }

      function carFreezeReason(cooldown = {}) {
        if (cooldown.reason === "conversation_busy" || conversationBusyFreezeText(cooldown.message)) {
          return "上游任务繁忙，等待自动重试";
        }
        const reasons = {
          conversation_not_created: "上游没有创建对话",
          image_quota: "该车位生图额度已用完",
          image_cancelled: "上游取消了图片任务，等待自动复查",
          image_failure: "该车位生图失败，等待自动复查",
          car_session_contention: "该车位导致账号掉线，已暂停 2 小时",
          car_auth: "该车位登录状态异常",
          car_plan_mismatch: "当前账号不能使用该车位套餐",
          subscription_missing: "该车位没有可用套餐",
          subscription_expired: "该车位套餐已到期"
        };
        return reasons[cooldown.reason] || "该车位暂时不可用";
      }

      function carTypeName(carType) {
        const names = { chatgpt: "GPT", gemini: "Gemini", grok: "Grok" };
        return names[String(carType || "chatgpt").toLowerCase()] || "聊天";
      }

      function carFreezeRecoveryText(value, now = Date.now()) {
        const until = Number(value);
        const currentTime = Number.isFinite(Number(now)) ? Number(now) : Date.now();
        const remainingMs = until - currentTime;
        if (!Number.isFinite(until) || remainingMs <= 0) return "";
        const totalMinutes = Math.max(1, Math.ceil(remainingMs / 60_000));
        if (totalMinutes < 60) return `${totalMinutes} 分钟后恢复`;
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (hours < 24) return `${hours} 小时${minutes ? ` ${minutes} 分钟` : ""}后恢复`;
        return `${formatDateTime(until)} 恢复`;
      }

      function quotaProtectionSettings(value = {}) {
        const percent = (input, fallback) => {
          const number = Math.round(Number(input));
          return Math.min(99, Math.max(1, Number.isFinite(number) ? number : fallback));
        };
        const first = percent(value.randomMinPercent, 1);
        const second = percent(value.randomMaxPercent, 20);
        return {
          enabled: value.enabled === true,
          mode: value.mode === "random" ? "random" : "fixed",
          fixedPercent: percent(value.fixedPercent, 20),
          randomMinPercent: Math.min(first, second),
          randomMaxPercent: Math.max(first, second)
        };
      }

      function quotaProtectionSettingsKey(value = {}) {
        const settings = quotaProtectionSettings(value);
        return settings.mode === "random"
          ? `random:${settings.randomMinPercent}:${settings.randomMaxPercent}`
          : `fixed:${settings.fixedPercent}`;
      }

      function quotaProtectionState(status = {}, key = "", channel = {}) {
        const settings = quotaProtectionSettings(channel?.settings?.quotaProtection);
        if (!settings.enabled) return null;
        const state = status.meta?.quotaProtection?.states?.[key];
        return state?.settingsKey === quotaProtectionSettingsKey(settings) ? state : null;
      }

      function accountQuotaProtectionItems(account, channel) {
        if (channel?.type !== "shareai") return [];
        const settings = quotaProtectionSettings(channel?.settings?.quotaProtection);
        if (!settings.enabled) return [];
        const items = [];
        if (channelAbilityEnabled(channel, "drawing")) {
          const drawing = abilityStatus(account, "drawing");
          const state = quotaProtectionState(drawing, "drawing", channel);
          items.push({
            key: "drawing",
            label: "绘图",
            quota: state?.quota ?? drawing.quota ?? account.quota,
            settings,
            state
          });
        }
        if (channelAbilityEnabled(channel, "chatplus")) {
          const chatplus = abilityStatus(account, "chatplus");
          chatModelsForChannel(channel)
            .filter((model) => model.enabled)
            .forEach((model) => {
              const state = quotaProtectionState(chatplus, model.key, channel);
              const usage = chatplus.meta?.referenceUsage?.[model.key] || {};
              items.push({
                key: `chatplus-${model.key}`,
                label: model.name,
                quota: state?.quota ?? usage.quota,
                settings,
                state
              });
            });
        }
        return items;
      }

      function quotaProtectionThresholdText(item = {}) {
        const state = item.state && typeof item.state === "object" ? item.state : {};
        const settings = item.settings && typeof item.settings === "object" ? item.settings : {};
        const rawPercent = state.thresholdPercent ?? (settings.mode === "fixed" ? settings.fixedPercent : null);
        const percent = Number(rawPercent);
        if (!Number.isFinite(percent) || percent <= 0) return "检测后确定";

        const quota = Number(state.quota ?? item.quota);
        if (!Number.isFinite(quota) || quota <= 0) return `${percent}%`;
        const threshold = Math.round((quota * percent / 100) * 10) / 10;
        return String(threshold);
      }

      function quotaPairText(quota, balance) {
        if ([quota, balance].every((item) => item === null || item === undefined || item === "")) return "-";
        return `${valueText(balance)}/${valueText(quota)}`;
      }

      function quotaTextCell(text, protectionItems = []) {
        const protectionByLabel = new Map(protectionItems.map((item) => [item.label, item]));
        const lines = String(text || "-").split("｜").filter(Boolean);
        return h("div", { className: "quota-list" }, lines.map((line, index) => {
          const separatorAt = line.indexOf(" ");
          const label = separatorAt > 0 ? line.slice(0, separatorAt) : "";
          const value = separatorAt > 0 ? line.slice(separatorAt + 1) : line;
          const protection = protectionByLabel.get(label);
          const threshold = protection && value.includes("/") ? quotaProtectionThresholdText(protection) : "";
          const metric = quotaMetricDetails(value, protection?.state?.active === true);
          return h("div", {
            className: `quota-line is-${metric.tone}`,
            key: `${label || "quota"}-${index}`
          }, [
            h("div", { className: "quota-line-heading", key: "heading" }, [
              h("div", { className: "quota-label-group", key: "label-group" }, [
                label ? h("span", { className: "quota-name", key: "label" }, label) : null,
                threshold ? h("span", {
                  className: `quota-protection-note${protection.state?.active ? " is-active" : ""}`,
                  key: "protection"
                }, `保护线 ${threshold}`) : null
              ].filter(Boolean)),
              metric.known
                ? h("span", { className: "quota-value", key: "value" }, [
                    h("strong", { key: "remaining" }, metric.remaining),
                    h("span", { key: "total" }, `/${metric.total}`)
                  ])
                : h("span", { className: "quota-value is-text", key: "value" }, metric.text)
            ]),
            metric.known ? h("div", {
              className: "quota-meter",
              role: "img",
              "aria-label": `${label || "额度"}剩余 ${metric.remaining}，总额 ${metric.total}`,
              key: "meter"
            }, h("span", {
              className: "quota-meter-fill",
              style: { width: `${metric.percent}%` }
            })) : null
          ].filter(Boolean));
        }));
      }

      function quotaMetricDetails(value, protectionActive = false) {
        const text = String(value || "-").trim();
        const match = text.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
        if (!match) return { known: false, text, tone: "normal" };
        const remaining = Number(match[1]);
        const total = Number(match[2]);
        if (!Number.isFinite(remaining) || !Number.isFinite(total) || total <= 0) {
          return { known: false, text, tone: "normal" };
        }
        const percent = Math.max(0, Math.min(100, Math.round((remaining / total) * 100)));
        return {
          known: true,
          remaining: match[1],
          total: match[2],
          percent,
          tone: protectionActive ? "critical" : percent <= 20 ? "low" : "normal"
        };
      }

      function aggregateChatReferenceUsage(accounts, channelType, modelKeys) {
        const statuses = accounts
          .filter((item) => item.enabled !== false)
          .map((item) => channelType === "shareai" ? item?.meta?.abilities?.chatplus || {} : item);
        const referenceUsage = {};

        modelKeys.forEach((modelKey) => {
          const usages = statuses
            .map((status) => {
              const usage = status?.meta?.referenceUsage?.[modelKey];
              if (!usage) return null;
              const activeModelKey = String(status.quotaModel || status.meta?.chatModel || "").trim().toLowerCase();
              const confirmedUsageLimit = status.status === "quota_empty"
                && status.quotaConfirmedByUpstream === true
                && status.quotaReason !== "image_quota"
                && (!activeModelKey || activeModelKey === modelKey);
              return confirmedUsageLimit ? { ...usage, balance: 0 } : usage;
            })
            .filter((usage) => (
              usage
              && usage.quota !== null
              && usage.quota !== undefined
              && String(usage.quota).trim() !== ""
              && Number.isFinite(Number(usage.quota))
              && usage.balance !== null
              && usage.balance !== undefined
              && String(usage.balance).trim() !== ""
              && Number.isFinite(Number(usage.balance))
            ));
          if (!usages.length) return;

          const quota = usages.reduce((sum, usage) => sum + Number(usage.quota), 0);
          const balance = usages.reduce((sum, usage) => sum + Number(usage.balance), 0);
          const commonValue = (key) => {
            const values = usages.map((usage) => String(usage[key] || "").trim());
            return values.every(Boolean) && new Set(values).size === 1 ? values[0] : "";
          };
          const expireAt = commonValue("expireAt");
          const quotaResetSource = commonValue("quotaResetSource");
          referenceUsage[modelKey] = {
            quota,
            balance,
            used: Math.max(0, quota - balance),
            quotaResetAt: commonValue("quotaResetAt"),
            period: commonValue("period"),
            ...(quotaResetSource ? { quotaResetSource } : {}),
            ...(expireAt ? { expireAt } : {})
          };
        });

        return referenceUsage;
      }

      function chatQuotaText(account, channel, status = {}) {
        const modelName = checkedChatModelName(account, channel);
        if (status.status === "subscription_missing") return `${modelName} 未订阅`;
        if (chatSubscriptionExpired(status)) return `${modelName} 套餐已过期`;
        const activeModelKey = chatModelKey(status.quotaModel || status.meta?.chatModel);
        const confirmedUsageLimit = confirmedChatQuotaEmpty(status) && status.quotaReason !== "image_quota";
        const referenceParts = chatModelsForChannel(channel)
          .filter((item) => item.enabled)
          .map((item) => {
            const usage = status.meta?.referenceUsage?.[item.key];
            const quotaKnown = usage
              && usage.quota !== null
              && usage.quota !== undefined
              && String(usage.quota).trim() !== ""
              && Number.isFinite(Number(usage.quota));
            const balanceKnown = usage
              && usage.balance !== null
              && usage.balance !== undefined
              && String(usage.balance).trim() !== ""
              && Number.isFinite(Number(usage.balance));
            if (!quotaKnown || !balanceKnown) return "";
            const balance = confirmedUsageLimit && (!activeModelKey || activeModelKey === item.key)
              ? 0
              : usage.balance;
            return `${item.name} ${valueText(balance)}/${valueText(usage.quota)}`;
          })
          .filter(Boolean);
        if (referenceParts.length) return referenceParts.join("｜");
        if (confirmedChatQuotaEmpty(status)) {
          return status.quotaReason === "image_quota"
            ? `${modelName} 生图已用完`
            : `${modelName} 已用完`;
        }
        if (status.status === "unknown" || !status.status) return `${modelName} 未检测`;
        if (status.status === "activation_required") return `${modelName} 未激活`;
        if (status.status === "proxy_restricted") return `${modelName} IP 被限制`;
        if (["error", "failed", "disconnected", "disabled"].includes(status.status)) return `${modelName} 暂不可用`;
        return `${modelName} 额度未获取`;
      }

      function chatQuotaResetTexts(channel, status = {}, now = Date.now()) {
        return chatModelsForChannel(channel)
          .filter((item) => item.enabled)
          .map((item) => {
            const usage = status.meta?.referenceUsage?.[item.key] || {};
            const activeModelKey = chatModelKey(status.quotaModel || status.meta?.chatModel);
            if (status.status === "subscription_missing" && (!activeModelKey || activeModelKey === item.key)) {
              return `${item.name} 未订阅`;
            }
            if (chatSubscriptionExpired(status) && (!activeModelKey || activeModelKey === item.key)) {
              return `${item.name} 套餐已过期`;
            }
            const confirmedResetAt = confirmedChatQuotaEmpty(status)
              && activeModelKey === item.key
              ? status.quotaResetAt
              : "";
            const quotaResetAt = confirmedResetAt || usage.quotaResetAt;
            if (quotaResetAt) {
              const remainingText = quotaResetTimeText(quotaResetAt, status, now, {
                modelKey: item.key,
                estimated: usage.quotaResetSource === "estimated"
              });
              return remainingText ? `${item.name} ${remainingText}` : "";
            }
            const refreshText = quotaResetTimeText("", status, now, { modelKey: item.key });
            if (refreshText) return `${item.name} ${refreshText}`;
            if (usage.period) {
              const period = String(usage.period).trim()
                .replace(/^(\d+(?:\.\d+)?)\s*h$/i, "$1小时")
                .replace(/^(\d+(?:\.\d+)?)\s*d$/i, "$1天")
                .replace(/^(\d+(?:\.\d+)?)\s*m$/i, "$1分钟");
              return `${item.name} 每${period}重置（具体时间待确认）`;
            }
            return "";
          })
          .filter(Boolean);
      }

      function accountBalanceForTotal(account, channel) {
        if (channel?.type === "shareai") {
          const drawing = abilityStatus(account, "drawing");
          return channelAbilityEnabled(channel, "drawing")
            ? numberValue(drawing.balance ?? account.balance ?? account.quota)
            : 0;
        }
        if (channel?.type === "chatplus") return 0;
        return numberValue(account.balance ?? account.quota);
      }

      function chatModelKey(value) {
        return String(value || "").trim().toLowerCase();
      }

      function chatModelsForChannel(channel) {
        const settings = channel?.settings || {};
        const source = Array.isArray(settings.chatModels) && settings.chatModels.length ? settings.chatModels : chatModelDefaults;
        const defaultKey = chatModelKey(settings.defaultChatModel) || source.find((item) => item.default)?.key || "gpt";
        return source.map((item, index) => {
          const fallback = chatModelDefaults[index] || {};
          const key = chatModelKey(item?.key || fallback.key || `model-${index + 1}`);
          return {
            key,
            name: item?.name || fallback.name || key,
            carType: item?.carType || fallback.carType || "",
            model: item?.model || fallback.model || "",
            strategy: item?.strategy || fallback.strategy || "balanced",
            carTier: item?.carTier || fallback.carTier || "auto",
            enabled: item?.enabled !== false,
            default: key === defaultKey || item?.default === true
          };
        });
      }

      function checkedChatModelName(account, channel) {
        const checkedKey = chatModelKey(abilityStatus(account, "chatplus")?.meta?.chatModel || account?.meta?.chatModel);
        const enabledModels = chatModelsForChannel(channel).filter((item) => item.enabled);
        return enabledModels.find((item) => item.key === checkedKey)?.name
          || enabledModels.find((item) => item.default)?.name
          || enabledModels[0]?.name
          || "聊天";
      }

      function chatModelSelectOptions(channel) {
        return chatModelsForChannel(channel)
          .filter((item) => item.enabled)
          .map((item) => ({ label: item.default ? `${item.name} / 默认` : item.name, value: item.key }));
      }

      function statusInfo(status) {
        const map = {
          ok: ["success", "可用"],
          subscription_missing: ["default", "未订阅"],
          subscription_expired: ["error", "套餐已过期"],
          disconnected: ["warning", "自动换线中"],
          proxy_restricted: ["error", "IP 被限制"],
          quota_empty: ["warning", "额度不足"],
          check_timeout: ["warning", "检测超时"],
          error: ["error", "异常"],
          success: ["success", "成功"],
          failed: ["error", "失败"],
          safety_review: ["warning", "安全审核"],
          concurrency_limited: ["warning", "并发已满"],
          quota_protected: ["warning", "额度保护"],
          cancelled: ["default", "已取消"],
          queued: ["processing", "排队中"],
          processing: ["processing", "处理中"],
          waiting_upstream: ["processing", "已提交，等待图片"],
          interrupted: ["warning", "结果待确认"],
          activation_required: ["warning", "未激活"],
          activation_failed: ["error", "激活失败"],
          activation_uncertain: ["warning", "激活待确认"],
          registration_failed: ["error", "注册失败"],
          registration_uncertain: ["warning", "注册待确认"],
          ready: ["success", "已激活"],
          already_bound: ["success", "已绑定"],
          duplicate: ["warning", "重复"],
          valid: ["default", "待处理"],
          disabled: ["default", "已停用"],
          empty: ["warning", "未绑定账号"],
          unknown: ["default", "未检测"]
        };
        return map[status] || ["processing", status || "处理中"];
      }

      function statusTag(status) {
        const [color, text] = statusInfo(status);
        return h(Tag, { color }, text);
      }

      function taskStatusTag(row) {
        const status = taskPresentationStatus(row);
        const [color, text] = statusInfo(status);
        const style = status === "concurrency_limited"
          ? { marginInlineEnd: 0, borderColor: "#fde68a", background: "#fffbeb", color: "#78350f" }
          : { marginInlineEnd: 0 };
        return h(Tag, { color, style }, text);
      }

      function pipeProxyExpireText(value) {
        const parts = String(value || "").trim().split("|").map((part) => part.trim());
        if (parts.length < 5) return "";
        const [host, port, username, password, expiresAt] = parts;
        return host && port && username && password && expiresAt ? expiresAt : "";
      }

      function isPipeProxyExpired(value) {
        const expiresAt = pipeProxyExpireText(value);
        if (!expiresAt) return false;
        const dateText = /^\d{4}-\d{2}-\d{2}$/.test(expiresAt) ? `${expiresAt}T23:59:59+08:00` : expiresAt;
        const date = new Date(dateText);
        return Number.isFinite(date.getTime()) && date.getTime() < Date.now();
      }

      function proxyHostText(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        const pipeParts = text.split("|").map((part) => part.trim());
        if (pipeParts.length >= 4 && pipeParts[0]) return pipeParts[0];
        try {
          return new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(text) ? text : `http://${text}`).hostname || "已配置";
        } catch (_error) {
          return "已配置";
        }
      }

      function isIpAddress(value) {
        const text = String(value || "").trim();
        return /^(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$/.test(text)
          || /^(?:[a-f0-9]{1,4}:){2,}[a-f0-9:.]{1,}$/i.test(text);
      }

      function proxyRealIpText(check) {
        const realIp = String(check?.realIp || "").trim();
        if (isIpAddress(realIp)) return realIp;
        const legacyIp = String(check?.ip || "").trim();
        return isIpAddress(legacyIp) ? legacyIp : "";
      }

      function proxyCell(value, row) {
        if (!value) return h(Tag, { color: "default" }, "服务器IP");
        const expiresAt = pipeProxyExpireText(value);
        const expired = isPipeProxyExpired(value);
        const check = row?.meta?.proxyCheck || {};
        const status = expired ? "failed" : check.status === "ok" ? "ok" : check.status === "failed" ? "failed" : "pending";
        const statusText = expired ? "已到期" : status === "ok" ? "正常" : status === "failed" ? "不可用" : "等待任务检测";
        const color = status === "ok" ? "green" : status === "failed" ? "red" : "default";
        const hostText = proxyHostText(value);
        const realIpText = proxyRealIpText(check);
        const content = h("div", { className: "proxy-cell" }, [
          h(Tag, { color, style: { marginInlineEnd: 0 }, key: "ip" }, realIpText || hostText),
          realIpText && hostText && realIpText !== hostText
            ? h("span", { className: "proxy-host", key: "host", title: hostText }, `代理域名 ${hostText}`)
            : null,
          h("span", { className: `proxy-state ${status}`, key: "status" }, statusText),
          expiresAt ? h("span", { className: `proxy-expire${expired ? " expired" : ""}`, key: "expire" }, `到期 ${expiresAt}`) : null
        ]);
        return check.message && status === "failed" ? h(Tooltip, { title: check.message }, content) : content;
      }

      const accountImportHeaderAliases = {
        name: "name",
        "账号名称": "name",
        username: "username",
        "登录账号": "username",
        "账号": "username",
        password: "password",
        "登录密码": "password",
        "密码": "password",
        proxyurl: "proxyUrl",
        "代理ip": "proxyUrl",
        "代理 ip": "proxyUrl",
        "代理": "proxyUrl"
      };

      function normalizeAccountImportHeader(value) {
        const text = String(value || "").replace(/^\uFEFF/, "").trim();
        return accountImportHeaderAliases[text.toLowerCase()] || text;
      }

      function validAccountImportProxy(value) {
        const text = String(value || "").trim();
        if (!text) return true;
        if (text.includes("|")) {
          const parts = text.split("|").map((item) => item.trim());
          const port = Number(parts[1]);
          return parts.length >= 4
            && Boolean(parts[0] && parts[2] && parts[3])
            && Number.isInteger(port)
            && port >= 1
            && port <= 65535;
        }
        try {
          const parsed = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(text) ? text : `http://${text}`);
          return Boolean(parsed.hostname);
        } catch {
          return false;
        }
      }

      function accountImportProxyLabel(value) {
        const text = String(value || "").trim();
        if (!text) return "服务器 IP";
        if (text.includes("|")) {
          const [host, port] = text.split("|").map((item) => item.trim());
          return [host, port].filter(Boolean).join(":") || "已配置代理";
        }
        try {
          const parsed = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(text) ? text : `http://${text}`);
          return [parsed.hostname, parsed.port].filter(Boolean).join(":") || "已配置代理";
        } catch {
          return "格式不正确";
        }
      }

      function maskedActivationCode(value) {
        const text = String(value || "").trim();
        if (text.length <= 8) return text ? `${text.slice(0, 2)}••••` : "-";
        return `${text.slice(0, 4)}••••${text.slice(-4)}`;
      }

      function parseCloudlianRegistrationText(value) {
        const lines = String(value || "").split(/\r?\n/);
        const source = lines
          .map((line, index) => ({ rowNumber: index + 1, text: line.trim() }))
          .filter((row) => row.text);
        if (source.length > 500) return { rows: [], error: "每次最多处理 500 条激活码，请拆分后重试。" };
        const seen = new Set();
        const rows = source.map((row, index) => {
          const fields = row.text.split(/\s+/).filter(Boolean);
          const activationCode = fields[0] || "";
          const proxyUrl = fields[1] || "";
          const errors = [];
          if (fields.length > 2) errors.push("每行只能填写激活码和一个注册 IP");
          if (activationCode.length > 512) errors.push("激活码过长");
          if (proxyUrl.length > 2048) errors.push("注册 IP 内容过长");
          if (proxyUrl && !validAccountImportProxy(proxyUrl)) errors.push("注册 IP 格式不正确");
          const duplicateKey = activationCode.toLowerCase();
          const duplicate = !errors.length && seen.has(duplicateKey);
          if (!errors.length && !duplicate) seen.add(duplicateKey);
          return {
            key: `cloudlian-registration-${index}`,
            rowId: String(row.rowNumber),
            rowNumber: row.rowNumber,
            activationCode,
            proxyUrl,
            status: errors.length ? "failed" : duplicate ? "duplicate" : "valid",
            message: errors.join("；") || (duplicate ? "本次名单中有相同激活码" : "等待注册")
          };
        });
        return { rows, error: "" };
      }

      function batchRenewalStatus(account = {}) {
        const statuses = [
          account.status,
          account.meta?.registration?.status,
          ...Object.values(account.meta?.abilities || {}).map((ability) => ability?.status)
        ];
        const explicitStatus = ["activation_required", "subscription_expired", "subscription_missing"]
          .find((status) => statuses.includes(status));
        if (explicitStatus) return explicitStatus;
        const expirySources = [
          account,
          account.meta?.registration,
          ...Object.values(account.meta?.abilities || {})
        ].filter(Boolean);
        return expirySources.some((status) => chatSubscriptionExpired(status))
          ? "subscription_expired"
          : "";
      }

      function batchRenewalEligible(account, channel) {
        return Boolean(
          account
          && channel
          && account.enabled !== false
          && account.channelId === channel.id
          && chatAccountActivationAvailable(channel)
          && batchRenewalStatus(account)
        );
      }

      function parseBatchRenewalCodes(value) {
        const source = String(value || "")
          .split(/\r?\n/)
          .map((line, index) => ({ rowNumber: index + 1, activationCode: line.trim() }))
          .filter((row) => row.activationCode);
        if (source.length > 500) {
          return { rows: [], error: "每次最多处理 500 条激活码，请拆分后重试。" };
        }
        const seen = new Set();
        return {
          error: "",
          rows: source.map((row, index) => {
            const duplicateKey = row.activationCode.toLowerCase();
            const tooLong = row.activationCode.length > 512;
            const duplicate = !tooLong && seen.has(duplicateKey);
            if (!tooLong && !duplicate) seen.add(duplicateKey);
            return {
              key: `batch-renewal-${index}`,
              rowId: String(row.rowNumber),
              rowNumber: row.rowNumber,
              activationCode: row.activationCode,
              accountId: "",
              status: tooLong ? "failed" : duplicate ? "duplicate" : "valid",
              message: tooLong
                ? "激活码过长"
                : duplicate
                  ? "本次名单中有相同激活码"
                  : "等待续费"
            };
          })
        };
      }

      function createBatchRenewalPreview(value, accounts, random = Math.random) {
        const parsed = parseBatchRenewalCodes(value);
        if (parsed.error) return parsed;
        const shuffledAccounts = [...(accounts || [])];
        for (let index = shuffledAccounts.length - 1; index > 0; index -= 1) {
          const target = Math.floor(random() * (index + 1));
          [shuffledAccounts[index], shuffledAccounts[target]] = [shuffledAccounts[target], shuffledAccounts[index]];
        }
        let nextAccount = 0;
        return {
          error: "",
          rows: parsed.rows.map((row) => {
            if (row.status !== "valid") return row;
            const account = shuffledAccounts[nextAccount];
            nextAccount += 1;
            return account
              ? { ...row, accountId: account.id }
              : { ...row, status: "failed", message: "没有更多待续费账号可以分配" };
          })
        };
      }

      function parseProxyAssignText(value) {
        const text = String(value || "").trim();
        if (!text) return [];
        const parsed = window.Papa
          ? window.Papa.parse(text, { delimiter: ",", skipEmptyLines: "greedy" }).data
          : text.split(/\r?\n/).map((line) => [line]);
        const proxies = (parsed || [])
          .map((row) => (Array.isArray(row) ? row : [row]).find((cell) => String(cell ?? "").trim()))
          .map((cell) => String(cell ?? "").trim())
          .filter(Boolean);
        if (["proxy", "proxyurl", "代理", "代理ip", "代理 ip"].includes(String(proxies[0] || "").toLowerCase())) {
          proxies.shift();
        }
        return proxies;
      }

      function proxyAssignView(preview) {
        const rows = preview?.rows || [];
        const proxies = preview?.proxies || [];
        const usedByChannel = new Map();
        rows.forEach((row) => {
          if (!row.proxyUrl) return;
          const used = usedByChannel.get(row.channelId) || new Set();
          used.add(row.proxyUrl);
          usedByChannel.set(row.channelId, used);
        });
        const channelSource = preview?.unusedByChannel || [];
        const unavailableSource = preview?.unavailableByChannel || [];
        const unusedByChannel = (preview?.channelIds || []).map((channelId) => {
          const channel = channelSource.find((item) => item.channelId === channelId) || {};
          const used = usedByChannel.get(channelId) || new Set();
          const unavailable = new Set(unavailableSource.find((item) => item.channelId === channelId)?.proxies || []);
          return {
            channelId,
            channelName: channel.channelName || rows.find((row) => row.channelId === channelId)?.channelName || "未命名渠道",
            proxies: proxies.filter((proxy) => !used.has(proxy) && !unavailable.has(proxy))
          };
        });
        return {
          accounts: rows.length,
          assigned: rows.filter((row) => row.proxyUrl).length,
          serverIp: rows.filter((row) => !row.proxyUrl).length,
          cleared: rows.filter((row) => row.previousProxyUrl && !row.proxyUrl).length,
          changed: rows.filter((row) => row.previousProxyUrl !== row.proxyUrl).length,
          unusedByChannel
        };
      }

      function proxyAssignResult(row) {
        if (row.previousProxyUrl === row.proxyUrl) {
          return row.proxyUrl
            ? h(Tag, { color: "green" }, "保留原代理")
            : h(Tag, null, "服务器 IP");
        }
        if (row.proxyUrl) return h(Tag, { color: "blue" }, row.previousProxyUrl ? "更换代理" : "分配代理");
        return h(Tag, { color: row.previousProxyUrl ? "orange" : "default" }, row.previousProxyUrl ? "清空代理" : "服务器 IP");
      }

      function parseAccountImportText(text, currentAccounts, channelId) {
        if (!window.Papa) return { rows: [], error: "导入组件加载失败，请刷新页面重试。" };
        const parsed = window.Papa.parse(String(text || ""), {
          delimiter: ",",
          skipEmptyLines: "greedy"
        });
        const sourceRows = (parsed.data || []).map((source, sourceIndex) => {
          const cells = (Array.isArray(source) ? source : [source])
            .map((value) => String(value ?? "").trim());
          return {
            sourceIndex,
            cells: cells.length === 1 && cells[0] ? cells[0].split(/\s+/) : cells
          };
        }).filter((row) => row.cells.some(Boolean));
        if (!sourceRows.length) return { rows: [], error: "" };

        const headerFields = sourceRows[0].cells.map(normalizeAccountImportHeader);
        const knownFields = new Set(["name", "username", "password", "proxyUrl"]);
        const recognizedHeaderCount = headerFields.filter((field) => knownFields.has(field)).length;
        const hasHeader = headerFields.includes("username") && headerFields.includes("password");
        if (recognizedHeaderCount && !hasHeader) {
          const missingFields = [
            ["username", "登录账号"],
            ["password", "登录密码"]
          ].filter(([key]) => !headerFields.includes(key)).map(([, label]) => label);
          return { rows: [], error: `缺少表头：${missingFields.join("、")}。` };
        }

        const dataRows = hasHeader ? sourceRows.slice(1) : sourceRows;
        if (dataRows.length > 500) {
          return { rows: [], error: "每次最多导入 500 个账号，请拆分后重试。" };
        }

        const parseErrors = new Map();
        (parsed.errors || []).forEach((error) => {
          const rowIndex = Number(error.row);
          if (Number.isInteger(rowIndex) && rowIndex >= 0) {
            parseErrors.set(rowIndex, error.message || "CSV 格式不正确");
          }
        });
        const existing = new Set(
          currentAccounts
            .filter((account) => account.channelId === channelId)
            .map((account) => String(account.username || "").trim().toLowerCase())
            .filter(Boolean)
        );
        const seen = new Set(existing);
        const rows = dataRows.map(({ cells, sourceIndex }, index) => {
          let item = {};
          let structureError = "";
          if (hasHeader) {
            headerFields.forEach((field, fieldIndex) => {
              if (knownFields.has(field)) item[field] = cells[fieldIndex] || "";
            });
          } else if (cells.length === 2) {
            [item.username, item.password] = cells;
          } else if (cells.length === 3) {
            [item.username, item.password, item.proxyUrl] = cells;
          } else if (cells.length === 4) {
            [item.name, item.username, item.password, item.proxyUrl] = cells;
          } else {
            structureError = "每行需要填写 2、3 或 4 项";
          }

          const username = String(item.username || "").trim();
          const name = String(item.name || username).trim();
          const password = String(item.password ?? "");
          const proxyUrl = String(item.proxyUrl || "").trim();
          const errors = [];
          if (parseErrors.has(sourceIndex)) errors.push(parseErrors.get(sourceIndex));
          if (structureError) errors.push(structureError);
          if (!username) errors.push("缺少登录账号");
          if (!password) errors.push("缺少登录密码");
          if (proxyUrl && !validAccountImportProxy(proxyUrl)) errors.push("代理 IP 格式不正确");

          const duplicateKey = username.toLowerCase();
          const duplicate = !errors.length && seen.has(duplicateKey);
          if (!errors.length && !duplicate) seen.add(duplicateKey);
          return {
            key: `account-import-${index}`,
            rowNumber: sourceIndex + 1,
            name,
            username,
            password,
            proxyUrl,
            status: errors.length ? "error" : duplicate ? "duplicate" : "valid",
            message: errors.join("；") || (duplicate ? "同一渠道已有相同登录账号" : "可导入")
          };
        });
        return { rows, error: "" };
      }

      function uniqueImageUrls(values = []) {
        const urls = Array.isArray(values) ? values : [];
        return [...new Set(urls
          .map((value) => typeof value === "string" ? value.trim() : "")
          .filter(Boolean))];
      }

      function requestMessageImageUrls(row = {}) {
        const messages = Array.isArray(row?.requestJson?.messages) ? row.requestJson.messages : [];
        return messages.flatMap((message) => Array.isArray(message?.content)
          ? message.content.map((part) => {
              const value = typeof part?.image_url === "string"
                ? part.image_url
                : part?.image_url?.url;
              return /^data:image\/[a-z0-9.+-]+;base64,/i.test(String(value || "")) ? value : "";
            })
          : []);
      }

      function taskInputImageUrls(row = {}) {
        const requestFiles = Array.isArray(row?.requestJson?.files) ? row.requestJson.files : [];
        return uniqueImageUrls([
          ...(Array.isArray(row.inputImageUrls) ? row.inputImageUrls : []),
          ...requestFiles.map((file) => file?.previewUrl),
          ...requestMessageImageUrls(row)
        ]);
      }

      function taskWaitingIssueText(row) {
        if (!["waiting_upstream", "interrupted"].includes(String(row?.status || ""))) return "";
        if (row?.raw?.imageMirrorPending && row?.raw?.resultSaveError) {
          return "结果保存异常：图片已经生成，但上游返回的文件暂时无法保存。";
        }
        const text = String(row?.raw?.refreshErrorMessage || "").trim();
        if (!text) return "";
        if (/401|403|身份验证失败|重新登录|未登录|登录.{0,8}(?:失效|过期)|unauthorized|forbidden|session expired/i.test(text)) {
          return "查询结果异常：上游登录状态失效。";
        }
        if (/没有返回有效任务状态|TASK_STATE_UNAVAILABLE/i.test(text)) {
          return "查询结果异常：上游暂未返回有效任务状态。";
        }
        if (/服务器|网络|超时|timeout|timed out|fetch failed|ECONN|EAI_AGAIN|502|503|504/i.test(text)) {
          return "查询结果异常：上游服务暂时无法访问。";
        }
        return "查询结果异常：暂时无法读取生成结果。";
      }

      function taskOutputImageUrls(row = {}) {
        return uniqueImageUrls(row.imageUrls);
      }

      function taskComparisonSection(title, urls, emptyText) {
        return h("section", { className: "task-compare-section", key: title }, [
          h("div", { className: "task-compare-header", key: "header" }, [
            h("h3", { className: "task-compare-title", key: "title" }, title),
            urls.length ? h("span", { className: "task-compare-count", key: "count" }, `${urls.length} 张`) : null
          ]),

                key: url,
                src: url,
                alt: `${title} ${index + 1}`,
                preview: { mask: "查看大图" }
              }))))
            : h("div", { className: "task-compare-empty", key: "empty" }, h(Empty, {
                image: Empty.PRESENTED_IMAGE_SIMPLE,
                description: emptyText
              }))
        ]);
      }

      function taskRecordKind(row) {
        const storedKind = String(row?.recordKind || "").trim().toLowerCase();
        if (["chat", "image"].includes(storedKind)) return storedKind;
        const taskType = String(row?.taskType || "").trim().toLowerCase();
        if (taskType === "chat") return "chat";
        if (["text2img", "img2img"].includes(taskType)) return "image";
        const endpoint = String(row?.raw?.endpoint || "").trim().toLowerCase();
        return endpoint.includes("/chat/completions") ? "chat" : "image";
      }

      function taskRecordKindMatches(row, kind) {
        const selectedKind = String(kind || "all").trim().toLowerCase();
        return selectedKind === "all" || taskRecordKind(row) === selectedKind;
      }

      function compactTaskText(value, limit = 360) {
        const normalized = String(value || "")
          .replace(/data:image\/[a-z0-9.+-]+;base64,(?:[a-z0-9+/=]+|\[omitted[^\]]*\])/gi, "[图片]")
          .replace(/\s+/g, " ")
          .trim();
        if (!normalized) return "";
        const maxLength = Math.max(20, Number(limit) || 360);
        return normalized.length > maxLength
          ? `${normalized.slice(0, maxLength).trimEnd()}…`
          : normalized;
      }

      function taskTextLengthLabel(value) {
        const length = typeof value === "number" ? Math.max(0, value) : String(value || "").trim().length;
        if (length < 1000) return `${length} 字`;
        if (length < 10000) return `${(length / 1000).toFixed(1)} 千字`;
        return `${(length / 10000).toFixed(1)} 万字`;
      }

      function taskReadableText(value) {
        return String(value || "").replace(
          /data:image\/[a-z0-9.+-]+;base64,(?:[a-z0-9+/=]+|\[omitted[^\]]*\])/gi,
          "[图片内容已省略]"
        );
      }

      function TaskCopyBlock({ label, value, options = {} }) {
        const [open, setOpen] = useState(false);
        const fullText = taskReadableText(value).trim();
        if (!fullText) return null;
        const limit = Number(options.limit) || 360;
        const preview = compactTaskText(fullText, limit);
        const fullLength = Math.max(fullText.length, Number(options.fullLength) || 0);
        const hasMore = options.summaryOnly !== true
          && (fullLength > limit || fullText.includes("\n"));
        return h("div", { className: "task-copy-block", key: options.key || label }, [
          h("div", { className: "task-copy-label", key: "label" }, label),
          h("div", {
            className: `task-copy-preview${options.answer ? " is-answer" : ""}`,
            key: "preview"
          }, preview),
          hasMore ? h("details", {
            className: "task-copy-detail",
            key: "detail",
            onToggle: (event) => setOpen(event.currentTarget.open)
          }, [
            h("summary", { key: "summary" }, `查看完整${label}（${taskTextLengthLabel(fullLength)}）`),
            open ? h("pre", { className: "task-copy-full", key: "content" }, fullText) : null
          ]) : null
        ]);
      }

      function taskCopyBlock(label, value, options = {}) {
        return h(TaskCopyBlock, { label, value, options, key: options.key || label });
      }

      function taskTypeLabel(type) {
        const map = {
          chat: "对话",
          img2img: "图生图",
          text2img: "文生图"
        };
        return map[type] || type || "-";
      }

      function taskChannelGroup(row) {
        if (row?.channelType === "drawing") return "drawing";
        if (row?.channelType === "chatplus") return "chatplus";
        const text = `${row?.channelName || ""} ${row?.channelId || ""}`;
        if (/绘图站|drawing/i.test(text)) return "drawing";
        if (/聊天|chatplus/i.test(text)) return "chatplus";
        return "other";
      }

      function taskChannelGroupLabel(value) {
        if (value === "drawing") return "绘图站";
        if (value === "chatplus") return "聊天";
        return "其他";
      }

      function taskSourceChannelMatches(row, sourceChannelId, accounts = []) {
        if (!sourceChannelId || sourceChannelId === "all") return true;
        const requestedId = String(sourceChannelId);
        const taskChannelId = String(row?.channelId || "");
        if (taskChannelId === requestedId || taskChannelId.startsWith(`${requestedId}:`)) return true;
        const account = accounts.find((item) => String(item?.id || "") === String(row?.accountId || ""));
        return String(account?.channelId || "") === requestedId;
      }

      function dateKeyInShanghai(value) {
        const date = new Date(value || Date.now());
        if (!Number.isFinite(date.getTime())) return "";
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(date);
      }

      function taskTime(row) {
        if (Number.isFinite(Number(row?.time))) return Number(row.time);
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(row?.day || ""))) {
          return Date.parse(`${row.day}T12:00:00+08:00`);
        }
        const time = Date.parse(row?.createdAt || row?.completedAt || row?.updatedAt || "");
        return Number.isFinite(time) ? time : 0;
      }

      function taskGeneratedImageCount(row) {
        if (Number.isFinite(Number(row?.successImages))) return Number(row.successImages);
        const urls = Array.isArray(row?.imageUrls) ? row.imageUrls.filter(Boolean).length : 0;
        if (urls) return urls;
        if (row?.status === "success" && row?.taskType !== "chat") return numberValue(row.imageCount);
        return 0;
      }

      function taskRecordCount(row) {
        const value = row?.tasks;
        return Math.max(0, numberValue(value === undefined || value === null ? 1 : value));
      }

      function failedTaskRecordCount(row) {
        const value = row?.failedTasks;
        return Math.max(0, numberValue(value === undefined || value === null ? taskRecordCount(row) : value));
      }

      function summarizeTaskRange(source, predicate) {
        const items = source.filter(predicate);
        return {
          tasks: items.reduce((sum, item) => sum + taskRecordCount(item), 0),
          successTasks: items.reduce((sum, item) => (
            sum + (item.status === "success" ? taskRecordCount(item) : 0)
          ), 0),
          successImages: items.reduce((sum, item) => sum + (item.status === "success" ? taskGeneratedImageCount(item) : 0), 0),
          failedTasks: items.reduce((sum, item) => (
            sum + (item.status === "failed" ? failedTaskRecordCount(item) : 0)
          ), 0)
        };
      }

      function summarizeTasks(source) {
        const now = Date.now();
        const todayKey = dateKeyInShanghai(now);
        const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
        return {
          today: summarizeTaskRange(source, (item) => dateKeyInShanghai(taskTime(item)) === todayKey),
          week: summarizeTaskRange(source, (item) => taskTime(item) >= sevenDaysAgo)
        };
      }

      function taskTrendData(daily, rangeDays, accountFilter, sourceChannelFilter, channelFilter, accounts, kind = "image") {
        const days = Array.isArray(daily?.days) ? daily.days.slice(-rangeDays) : [];
        const visibleDays = new Set(days);
        const totals = new Map(days.map((day) => [day, { day, tasks: 0, successTasks: 0, successImages: 0, failedTasks: 0 }]));
        const records = Array.isArray(daily?.records) ? daily.records : [];
        records.forEach((record) => {
          if (!visibleDays.has(record.day)) return;
          if (!taskRecordKindMatches(record, kind)) return;
          if (accountFilter !== "all" && record.accountId !== accountFilter) return;
          if (!taskSourceChannelMatches(record, sourceChannelFilter, accounts)) return;
          if (channelFilter !== "all" && record.channelGroup !== channelFilter) return;
          const current = totals.get(record.day);
          current.tasks += numberValue(record.tasks);
          current.successTasks += numberValue(record.successTasks);
          current.successImages += numberValue(record.successImages);
          current.failedTasks += numberValue(record.failedTasks);
        });
        return [...totals.values()];
      }

      function summarizeTrendRows(rows = []) {
        return rows.reduce((summary, row) => ({
          tasks: summary.tasks + numberValue(row.tasks),
          successTasks: summary.successTasks + numberValue(row.successTasks),
          successImages: summary.successImages + numberValue(row.successImages),
          failedTasks: summary.failedTasks + numberValue(row.failedTasks)
        }), { tasks: 0, successTasks: 0, successImages: 0, failedTasks: 0 });
      }

      function taskSuccessRateText(stats = {}) {
        const tasks = numberValue(stats.tasks);
        if (!tasks) return "0%";
        const rate = (numberValue(stats.successTasks) / tasks) * 100;
        const rounded = Math.round(rate * 10) / 10;
        return `${Number.isInteger(rounded) ? rounded.toFixed(0) : rounded.toFixed(1)}%`;
      }

      function chartDayLabel(day) {
        const [, month, date] = String(day || "").split("-");
        return month && date ? `${Number(month)}月${Number(date)}日` : day || "-";
      }

      function productivityRangeLabel(startDay, endDay) {
        return startDay === endDay
          ? chartDayLabel(startDay)
          : `${chartDayLabel(startDay)}–${chartDayLabel(endDay)}`;
      }

      function productivityEmptyRow(id, name, channelId = "", channelName = "") {
        return {
          id,
          name,
          channelId,
          channelName,
          imageTasks: 0,
          imageSuccessTasks: 0,
          imageFailedTasks: 0,
          successImages: 0,
          imageDurationMsTotal: 0,
          imageDurationSamples: 0,
          chatTasks: 0,
          chatSuccessTasks: 0,
          chatFailedTasks: 0,
          chatDurationMsTotal: 0,
          chatDurationSamples: 0
        };
      }

      function productivityRecordChannelId(record, accountMap) {
        const accountId = String(record?.accountId || "").trim();
        return String(record?.channelId || accountMap.get(accountId)?.channelId || "").trim();
      }

      function productivityRangeData(
        daily,
        accounts,
        startDay,
        endDay,
        accountFilter = "all",
        channelFilter = "all"
      ) {
        const rows = new Map();
        const accountList = Array.isArray(accounts) ? accounts : [];
        const accountMap = new Map(accountList.map((account) => [String(account.id), account]));
        let systemRejectedImageTasks = 0;
        let systemRejectedChatTasks = 0;
        let unassignedImageTasks = 0;
        let unassignedChatTasks = 0;
        accountList.forEach((account) => {
          const id = String(account.id);
          if (accountFilter !== "all" && id !== accountFilter) return;
          if (channelFilter !== "all" && String(account.channelId || "") !== channelFilter) return;
          rows.set(id, productivityEmptyRow(
            id,
            account.name || account.username || account.id || "未命名账号",
            account.channelId || "",
            account.channelName || ""
          ));
        });
        (Array.isArray(daily?.records) ? daily.records : []).forEach((record) => {
          if (record.day < startDay || record.day > endDay) return;
          const recordChannelId = productivityRecordChannelId(record, accountMap);
          if (channelFilter !== "all" && recordChannelId !== channelFilter) return;
          const recordKind = taskRecordKind(record);
          const accountKey = String(record.accountId || record.accountName || "").trim();
          if (!accountKey) {
            if (accountFilter !== "all") return;
            if (recordKind === "chat") {
              systemRejectedChatTasks += numberValue(record.systemRejectedTasks);
              unassignedChatTasks += numberValue(record.tasks);
            } else {
              systemRejectedImageTasks += numberValue(record.systemRejectedTasks);
              unassignedImageTasks += numberValue(record.tasks);
            }
            return;
          }
          if (accountFilter !== "all" && accountKey !== accountFilter) return;
          const current = rows.get(accountKey) || productivityEmptyRow(
            accountKey,
            record.accountName || record.accountId || "已移除账号",
            recordChannelId,
            record.channelName || ""
          );
          if (recordKind === "chat") {
            current.chatTasks += numberValue(record.tasks);
            current.chatSuccessTasks += numberValue(record.successTasks);
            current.chatFailedTasks += numberValue(record.failedTasks);
            current.chatDurationMsTotal += numberValue(record.durationMsTotal);
            current.chatDurationSamples += numberValue(record.durationSamples);
          } else {
            current.imageTasks += numberValue(record.tasks);
            current.imageSuccessTasks += numberValue(record.successTasks);
            current.imageFailedTasks += numberValue(record.failedTasks);
            current.successImages += numberValue(record.successImages);
            current.imageDurationMsTotal += numberValue(record.durationMsTotal);
            current.imageDurationSamples += numberValue(record.durationSamples);
          }
          rows.set(accountKey, current);
        });
        const list = [...rows.values()];
        const totalImages = list.reduce((sum, row) => sum + row.successImages, 0);
        const totalImageTasks = list.reduce((sum, row) => sum + row.imageTasks, 0);
        const totalImageSuccessTasks = list.reduce((sum, row) => sum + row.imageSuccessTasks, 0);
        const totalImageFailedTasks = list.reduce((sum, row) => sum + row.imageFailedTasks, 0);
        const totalChats = list.reduce((sum, row) => sum + row.chatSuccessTasks, 0);
        const totalChatTasks = list.reduce((sum, row) => sum + row.chatTasks, 0);
        const totalChatFailedTasks = list.reduce((sum, row) => sum + row.chatFailedTasks, 0);
        const imageDurationMsTotal = list.reduce((sum, row) => sum + row.imageDurationMsTotal, 0);
        const imageDurationSamples = list.reduce((sum, row) => sum + row.imageDurationSamples, 0);
        const chatDurationMsTotal = list.reduce((sum, row) => sum + row.chatDurationMsTotal, 0);
        const chatDurationSamples = list.reduce((sum, row) => sum + row.chatDurationSamples, 0);
        const activeAccounts = list.filter((row) => row.imageTasks > 0 || row.chatTasks > 0).length;
        const activeImageAccounts = list.filter((row) => row.imageTasks > 0).length;
        const activeChatAccounts = list.filter((row) => row.chatTasks > 0).length;
        const preAssignmentImageTasks = systemRejectedImageTasks + unassignedImageTasks;
        const preAssignmentChatTasks = systemRejectedChatTasks + unassignedChatTasks;
        return {
          startDay,
          endDay,
          totalImages,
          totalImageTasks,
          totalImageSuccessTasks,
          totalImageFailedTasks,
          totalChats,
          totalChatTasks,
          totalChatFailedTasks,
          preAssignmentImageTasks,
          preAssignmentChatTasks,
          preAssignmentTasks: preAssignmentImageTasks + preAssignmentChatTasks,
          activeAccounts,
          activeImageAccounts,
          activeChatAccounts,
          averageImagesPerAccount: activeImageAccounts ? totalImages / activeImageAccounts : 0,
          averageChatsPerAccount: activeChatAccounts ? totalChats / activeChatAccounts : 0,
          averageImageDurationMs: imageDurationSamples ? imageDurationMsTotal / imageDurationSamples : null,
          averageChatDurationMs: chatDurationSamples ? chatDurationMsTotal / chatDurationSamples : null,
          rows: list
            .map((row) => ({
              ...row,
              imageShare: totalImages ? row.successImages / totalImages : 0,
              chatShare: totalChats ? row.chatSuccessTasks / totalChats : 0,
              imageSuccessRate: row.imageTasks ? row.imageSuccessTasks / row.imageTasks : null,
              chatSuccessRate: row.chatTasks ? row.chatSuccessTasks / row.chatTasks : null,
              averageImageDurationMs: row.imageDurationSamples ? row.imageDurationMsTotal / row.imageDurationSamples : null,
              averageChatDurationMs: row.chatDurationSamples ? row.chatDurationMsTotal / row.chatDurationSamples : null
            }))
            .sort((a, b) => (
              b.successImages - a.successImages
              || b.chatSuccessTasks - a.chatSuccessTasks
              || (b.imageTasks + b.chatTasks) - (a.imageTasks + a.chatTasks)
              || a.name.localeCompare(b.name, "zh-CN")
            ))
        };
      }

      function productivityDayData(daily, accounts, day, accountFilter = "all", channelFilter = "all") {
        return productivityRangeData(daily, accounts, day, day, accountFilter, channelFilter);
      }

      function productivityAccountCompletion(row = {}) {
        const imageTasks = numberValue(row.imageTasks);
        const chatTasks = numberValue(row.chatTasks);
        return {
          totalTasks: imageTasks + chatTasks,
          successImages: numberValue(row.successImages),
          successChats: numberValue(row.chatSuccessTasks),
          failedTasks: numberValue(row.imageFailedTasks) + numberValue(row.chatFailedTasks)
        };
      }

      function productivityRuntimeData(concurrency, startDay, endDay) {
        const rows = (Array.isArray(concurrency?.days) ? concurrency.days : [])
          .filter((item) => item.day >= startDay && item.day <= endDay && numberValue(item.samples) > 0);
        const samples = rows.reduce((sum, item) => sum + numberValue(item.samples), 0);
        return {
          startDay,
          endDay,
          samples,
          averageRunning: samples
            ? rows.reduce((sum, item) => sum + numberValue(item.averageRunning) * numberValue(item.samples), 0) / samples
            : 0,
          peakRunning: rows.reduce((peak, item) => Math.max(peak, numberValue(item.peakRunning)), 0),
          averageConfigured: samples
            ? rows.reduce((sum, item) => sum + numberValue(item.averageConfigured) * numberValue(item.samples), 0) / samples
            : 0
        };
      }

      function productivityTrendData(
        daily,
        concurrency,
        startDay,
        endDay,
        accountFilter = "all",
        channelFilter = "all",
        accounts = []
      ) {
        const days = (Array.isArray(daily?.days) ? daily.days : [])
          .filter((day) => day >= startDay && day <= endDay);
        const visibleDays = new Set(days);
        const accountMap = new Map((Array.isArray(accounts) ? accounts : []).map((account) => [String(account.id), account]));
        const totals = new Map(days.map((day) => [day, {
          day,
          totalImages: 0,
          totalChats: 0,
          imageTasks: 0,
          imageSuccessTasks: 0,
          chatTasks: 0,
          chatSuccessTasks: 0,
          imageDurationMsTotal: 0,
          imageDurationSamples: 0,
          chatDurationMsTotal: 0,
          chatDurationSamples: 0,
          activeImageAccountIds: new Set(),
          activeChatAccountIds: new Set()
        }]));
        (Array.isArray(daily?.records) ? daily.records : []).forEach((record) => {
          if (!visibleDays.has(record.day)) return;
          const accountId = String(record.accountId || "").trim();
          if (!accountId || (accountFilter !== "all" && accountId !== accountFilter)) return;
          if (channelFilter !== "all" && productivityRecordChannelId(record, accountMap) !== channelFilter) return;
          const current = totals.get(record.day);
          if (taskRecordKind(record) === "chat") {
            current.totalChats += numberValue(record.successTasks);
            current.chatTasks += numberValue(record.tasks);
            current.chatSuccessTasks += numberValue(record.successTasks);
            current.chatDurationMsTotal += numberValue(record.durationMsTotal);
            current.chatDurationSamples += numberValue(record.durationSamples);
            if (numberValue(record.tasks) > 0) current.activeChatAccountIds.add(accountId);
          } else {
            current.totalImages += numberValue(record.successImages);
            current.imageTasks += numberValue(record.tasks);
            current.imageSuccessTasks += numberValue(record.successTasks);
            current.imageDurationMsTotal += numberValue(record.durationMsTotal);
            current.imageDurationSamples += numberValue(record.durationSamples);
            if (numberValue(record.tasks) > 0) current.activeImageAccountIds.add(accountId);
          }
        });
        const concurrencyByDay = new Map((Array.isArray(concurrency?.days) ? concurrency.days : []).map((item) => [item.day, item]));
        return [...totals.values()].map((row) => {
          const activeImageAccounts = row.activeImageAccountIds.size;
          const activeChatAccounts = row.activeChatAccountIds.size;
          const runtime = concurrencyByDay.get(row.day);
          return {
            day: row.day,
            totalImages: row.totalImages,
            totalChats: row.totalChats,
            activeImageAccounts,
            activeChatAccounts,
            averageImagesPerAccount: activeImageAccounts ? Number((row.totalImages / activeImageAccounts).toFixed(1)) : 0,
            averageChatsPerAccount: activeChatAccounts ? Number((row.totalChats / activeChatAccounts).toFixed(1)) : 0,
            averageImageDurationMs: row.imageDurationSamples ? Math.round(row.imageDurationMsTotal / row.imageDurationSamples) : null,
            averageChatDurationMs: row.chatDurationSamples ? Math.round(row.chatDurationMsTotal / row.chatDurationSamples) : null,
            imageSuccessRate: row.imageTasks ? Number((row.imageSuccessTasks / row.imageTasks * 100).toFixed(1)) : null,
            chatSuccessRate: row.chatTasks ? Number((row.chatSuccessTasks / row.chatTasks * 100).toFixed(1)) : null,
            imageTasks: row.imageTasks,
            imageSuccessTasks: row.imageSuccessTasks,
            chatTasks: row.chatTasks,
            chatSuccessTasks: row.chatSuccessTasks,
            averageRunning: runtime?.samples ? numberValue(runtime.averageRunning) : null,
            peakRunning: runtime?.samples ? numberValue(runtime.peakRunning) : null,
            averageConfigured: runtime?.samples ? numberValue(runtime.averageConfigured) : null
          };
        });
      }
