      function formatDuration(ms) {
        if (!Number.isFinite(ms) || ms < 0) return "-";
        const totalSeconds = Math.max(0, Math.floor(ms / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours) return `${hours}时${minutes}分${seconds}秒`;
        if (minutes) return `${minutes}分${seconds}秒`;
        return `${seconds}秒`;
      }

      function taskDuration(task, now) {
        const start = Date.parse(task.createdAt || task.raw?.created_at || "");
        if (!Number.isFinite(start)) return "-";
        const done = ["success", "failed", "cancelled", "interrupted"].includes(task.status)
          ? Date.parse(task.completedAt || task.updatedAt || "")
          : now;
        if (!Number.isFinite(done)) return "-";
        const text = formatDuration(done - start);
        return ["success", "failed", "cancelled", "interrupted"].includes(task.status) ? text : `已耗时 ${text}`;
      }

      function taskModelCode(value) {
        const rawModel = String(value ?? "").trim();
        const normalizedModel = rawModel.toLowerCase();
        if (["1", "chatgpt-image-2"].includes(normalizedModel)) return "gpt-image-2";
        if (normalizedModel === "2") return "nano-banana-pro";
        if (normalizedModel === "3") return "nano-banana";
        return rawModel || "未记录";
      }

      function taskRequestedModel(row = {}) {
        return row.raw?.requestedModel
          || row.requestJson?.model
          || row.requestJson?.chat_model
          || row.requestJson?.chatModel
          || row.requestJson?.model_id
          || row.requestJson?.modelId
          || row.modelId
          || "";
      }

      function taskActualModel(row = {}) {
        return row.raw?.upstreamModel
          || row.responseJson?.raw?.upstreamModel
          || row.responseJson?.upstreamModel
          || (row.channelType === "drawing" ? row.modelId : "")
          || "";
      }

      function taskModelInfo(row = {}) {
        const actualModel = taskActualModel(row);
        return {
          requested: taskModelCode(taskRequestedModel(row)),
          actual: actualModel
            ? taskModelCode(actualModel)
            : row.raw?.returnedError === true && row.raw?.submitted !== true
              ? "未调用"
              : "未记录"
        };
      }

      function taskModelCell(row = {}) {
        const info = taskModelInfo(row);
        return h("div", { className: "task-model-detail" }, [
          ["调用模型", info.requested],
          ["实际模型", info.actual]
        ].map(([label, value]) => h("div", { className: "task-model-line", key: label, title: `${label}：${value}` }, [
          h("span", { className: "task-model-label", key: "label" }, label),
          h("span", {
            className: `task-model-value${value === "未记录" ? " is-missing" : ""}`,
            key: "value"
          }, value)
        ])));
      }

      function channelName(config, channelId) {
        return config?.channels?.find((item) => item.id === channelId)?.name || channelId || "-";
      }

      function getChannelStatus(channel, relatedAccounts) {
        if (channel.enabled === false) return "disabled";
        if (!relatedAccounts.length) return "empty";
        const statuses = relatedAccounts
          .filter((item) => item.enabled !== false)
          .flatMap((item) => {
            const proxyCheck = item?.meta?.proxyCheck || {};
            if (isPipeProxyExpired(item.proxyUrl) || proxyCheck.status === "failed") return ["error"];
            const checkStatus = accountCheckDisplayStatus(item, channel);
            if (checkStatus) return [checkStatus];
            return accountCapabilityStates(item, channel).map((capability) => capability.status);
          });
        if (statuses.some((status) => status === "ok")) return "ok";
        if (statuses.some((status) => status === "check_timeout")) return "check_timeout";
        if (statuses.some((status) => status === "disconnected")) return "disconnected";
        if (statuses.some((status) => status === "error" || status === "failed")) return "error";
        if (statuses.some((status) => status === "subscription_expired")) return "subscription_expired";
        if (statuses.some((status) => status === "subscription_missing")) return "subscription_missing";
        if (statuses.some((status) => status === "quota_empty")) return "quota_empty";
        if (statuses.some((status) => status === "protection")) return "quota_protected";
        if (statuses.some((status) => status === "activation_required")) return "activation_required";
        return "unknown";
      }

      function chatDisplayStatus(status = {}) {
        if (status.status === "subscription_missing") return "subscription_missing";
        if (chatSubscriptionExpired(status)) return "subscription_expired";
        if (confirmedChatQuotaEmpty(status)) return "quota_empty";
        if (status.status === "quota_empty") return "ok";
        return status.status || "unknown";
      }

      function drawingDisplayStatus(status = {}) {
        const balance = status.balance;
        const balanceKnown = balance !== null
          && balance !== undefined
          && String(balance).trim() !== ""
          && Number.isFinite(Number(balance));
        if (balanceKnown && Number(balance) < 2) return "quota_empty";
        return status.status || "unknown";
      }

      function knownNumber(value) {
        return value !== null
          && value !== undefined
          && String(value).trim() !== ""
          && Number.isFinite(Number(value));
      }

      function capabilityStatusWithProtection(baseStatus, protection) {
        if (!protection?.state?.active) return baseStatus || "unknown";
        if (["error", "failed", "disconnected", "subscription_expired", "subscription_missing", "activation_required", "disabled"].includes(baseStatus)) {
          return baseStatus;
        }
        const balance = protection.state.balance;
        return knownNumber(balance) && Number(balance) <= 0 ? "quota_empty" : "protection";
      }

      function accountCapabilityStates(account, channel) {
        if (!channel) return [];
        const protectionByKey = new Map(
          accountQuotaProtectionItems(account, channel).map((item) => [item.key, item])
        );

        if (channel.type === "shareai") {
          const capabilities = [];
          if (channelAbilityEnabled(channel, "drawing")) {
            const protection = protectionByKey.get("drawing");
            capabilities.push({
              key: "drawing",
              label: "绘图",
              status: capabilityStatusWithProtection(
                drawingDisplayStatus(abilityStatus(account, "drawing")),
                protection
              ),
              protection
            });
          }

          if (channelAbilityEnabled(channel, "chatplus")) {
            const chatplus = abilityStatus(account, "chatplus");
            const baseStatus = chatDisplayStatus(chatplus);
            const activeModelKey = chatModelKey(chatplus.quotaModel || chatplus.meta?.chatModel);
            const enabledModels = chatModelsForChannel(channel).filter((model) => model.enabled);
            const visibleModels = enabledModels.filter((model) => (
              chatplus.meta?.referenceUsage?.[model.key]
              || protectionByKey.get(`chatplus-${model.key}`)?.state
              || model.key === activeModelKey
            ));
            const models = visibleModels.length
              ? visibleModels
              : [enabledModels.find((model) => model.default) || enabledModels[0]].filter(Boolean);

            models.forEach((model) => {
              const usage = chatplus.meta?.referenceUsage?.[model.key] || {};
              const protection = protectionByKey.get(`chatplus-${model.key}`);
              const expireTime = Date.parse(usage.expireAt || "");
              let modelStatus = Number.isFinite(expireTime) && expireTime <= Date.now()
                ? "subscription_expired"
                : baseStatus;
              if (!["error", "failed", "disconnected", "subscription_expired", "subscription_missing", "activation_required", "disabled"].includes(modelStatus)) {
                if (baseStatus === "quota_empty" && (!activeModelKey || model.key === activeModelKey)) modelStatus = "quota_empty";
                else if (knownNumber(usage.balance)) modelStatus = Number(usage.balance) <= 0 ? "quota_empty" : "ok";
                else if (baseStatus === "quota_empty" && activeModelKey && model.key !== activeModelKey) modelStatus = "unknown";
              }
              capabilities.push({
                key: `chatplus-${model.key}`,
                label: model.name,
                status: capabilityStatusWithProtection(modelStatus, protection),
                protection
              });
            });
          }
          return capabilities;
        }

        if (channel.type === "chatplus") {
          return [{
            key: "chatplus",
            label: checkedChatModelName(account, channel),
            status: chatDisplayStatus(account)
          }];
        }

        return [{ key: "drawing", label: "绘图", status: drawingDisplayStatus(account) }];
      }

      function summarizeAccountCapabilities(capabilities = []) {
        const statuses = capabilities.map((item) => item.status || "unknown");
        const errorStatuses = ["disconnected", "proxy_restricted", "error", "failed", "check_timeout"];
        const availableCount = statuses.filter((status) => status === "ok").length;
        const hasError = statuses.some((status) => errorStatuses.includes(status));
        if (availableCount === statuses.length && statuses.length) return { state: "available", group: "ok" };
        if (availableCount > 0) return { state: hasError ? "partial_error" : "partial", group: hasError ? "error" : "partial" };
        if (hasError) return { state: errorStatuses.find((status) => statuses.includes(status)) || "error", group: "error" };
        const priority = ["subscription_expired", "subscription_missing", "quota_empty", "protection", "activation_required", "unknown"];
        return { state: priority.find((status) => statuses.includes(status)) || "unknown", group: "business" };
      }

      function accountCapabilityReason(capability = {}) {
        const label = capability.label || "账号";
        const map = {
          ok: `${label}可用`,
          quota_empty: `${label}额度用完`,
          subscription_expired: `${label}套餐到期`,
          subscription_missing: `${label}未订阅`,
          disconnected: `${label}线路掉线`,
          proxy_restricted: `${label}IP 被限制`,
          error: `${label}异常`,
          failed: `${label}异常`,
          check_timeout: `${label}检测超时`,
          activation_required: `${label}未激活`,
          disabled: `${label}已停用`,
          unknown: `${label}未检测`
        };
        if (capability.status === "protection") {
          return `${label}达到保护线 ${quotaProtectionThresholdText(capability.protection)}`;
        }
        return map[capability.status] || `${label}暂不可用`;
      }

      function aggregateChatStatus(accounts, channel) {
        const enabledAccounts = accounts.filter((item) => item.enabled !== false);
        const statusFor = (account) => channel?.type === "shareai" ? abilityStatus(account, "chatplus") : account;
        const statuses = enabledAccounts.map(statusFor);
        if (!statuses.length) return { status: "unknown" };
        const quotaAccounts = enabledAccounts.filter((account) => (
          ["ok", "quota_empty"].includes(chatDisplayStatus(statusFor(account)))
        ));
        const referenceUsage = aggregateChatReferenceUsage(
          quotaAccounts.length ? quotaAccounts : enabledAccounts,
          channel?.type,
          chatModelsForChannel(channel).filter((item) => item.enabled).map((item) => item.key)
        );
        const withReferenceUsage = (status) => ({
          ...status,
          meta: {
            ...(status.meta || {}),
            referenceUsage
          }
        });
        const available = statuses.find((item) => chatDisplayStatus(item) === "ok");
        if (available) return withReferenceUsage({ ...available, status: "ok", quotaConfirmedByUpstream: false });
        const expired = statuses.find((item) => chatDisplayStatus(item) === "subscription_expired");
        if (expired) return withReferenceUsage({ ...expired, status: "subscription_expired" });
        const missing = statuses.find((item) => chatDisplayStatus(item) === "subscription_missing");
        if (missing) return withReferenceUsage({ ...missing, status: "subscription_missing" });
        const explicitEmpty = statuses.find(confirmedChatQuotaEmpty);
        if (explicitEmpty && statuses.every((item) => confirmedChatQuotaEmpty(item))) return withReferenceUsage(explicitEmpty);
        const unavailable = statuses.find((item) => ["subscription_missing", "subscription_expired", "activation_required", "error", "failed", "disconnected", "disabled"].includes(chatDisplayStatus(item)));
        return withReferenceUsage(unavailable || statuses[0] || { status: "unknown" });
      }

      function accountEffectiveStatus(account, channel) {
        if (account.enabled === false) return "disabled";
        if (channel?.type === "chatplus") return chatDisplayStatus(account);
        if (channel?.type !== "shareai") return account.status || "unknown";
        const statuses = [
          channelAbilityEnabled(channel, "drawing") ? drawingDisplayStatus(abilityStatus(account, "drawing")) : "",
          channelAbilityEnabled(channel, "chatplus") ? chatDisplayStatus(abilityStatus(account, "chatplus")) : ""
        ].filter(Boolean);
        if (!statuses.length) return account.status || "unknown";
        if (statuses.includes("subscription_expired")) return "subscription_expired";
        if (statuses.includes("subscription_missing")) return "subscription_missing";
        if (statuses.includes("disconnected")) return "disconnected";
        if (statuses.includes("proxy_restricted")) return "proxy_restricted";
        if (statuses.some((status) => status === "error" || status === "failed")) return "error";
        if (statuses.includes("ok")) return "ok";
        if (statuses.includes("quota_empty")) return "quota_empty";
        if (statuses.includes("activation_required")) return "activation_required";
        return account.status || "unknown";
      }

      function accountCheckDisplayStatus(account, channel) {
        const status = channel?.type === "shareai"
          ? abilityStatus(account, "chatplus")
          : channel?.type === "chatplus"
            ? account
            : {};
        return status?.meta?.accountCheck?.status === "timeout" ? "check_timeout" : "";
      }

      function getChannelStats(channel, accounts) {
        const related = accounts.filter((item) => item.channelId === channel.id);
        const enabled = related.filter((item) => item.enabled !== false);
        const serviceable = channel.enabled === false
          ? []
          : enabled.filter((item) => {
              const proxyCheck = item?.meta?.proxyCheck || {};
              return !isPipeProxyExpired(item.proxyUrl)
                && proxyCheck.status !== "failed"
                && accountCheckDisplayStatus(item, channel) !== "check_timeout";
            });
        const capabilityRows = serviceable.map((item) => accountCapabilityStates(item, channel));
        const okCount = capabilityRows.filter((items) => items.some((item) => item.status === "ok")).length;
        if (channel?.type === "shareai") {
          const drawingEnabled = channelAbilityEnabled(channel, "drawing");
          const chatEnabled = channelAbilityEnabled(channel, "chatplus");
          const drawingQuota = drawingEnabled ? related.reduce((sum, item) => sum + numberValue(abilityStatus(item, "drawing").quota ?? item.quota), 0) : 0;
          const drawingBalance = drawingEnabled ? related.reduce((sum, item) => sum + numberValue(abilityStatus(item, "drawing").balance ?? item.balance ?? item.quota), 0) : 0;
          const chatStatus = chatEnabled ? aggregateChatStatus(related, channel) : { status: "unknown" };
          return {
            accountCount: related.length,
            enabledCount: enabled.length,
            okCount,
            drawingOkCount: capabilityRows.filter((items) => items.some((item) => item.key === "drawing" && item.status === "ok")).length,
            chatOkCount: capabilityRows.filter((items) => items.some((item) => item.key.startsWith("chatplus") && item.status === "ok")).length,
            quota: drawingQuota,
            balance: drawingBalance,
            drawingQuota,
            drawingBalance,
            chatStatus,
            status: getChannelStatus(channel, related)
          };
        }
        const chatStatus = channel?.type === "chatplus"
          ? aggregateChatStatus(related, channel)
          : null;
        return {
          accountCount: related.length,
          enabledCount: enabled.length,
          okCount,
          quota: related.reduce((sum, item) => sum + numberValue(item.quota), 0),
          balance: related.reduce((sum, item) => sum + numberValue(item.balance ?? item.quota), 0),
          ...(chatStatus ? { chatStatus } : {}),
          status: getChannelStatus(channel, related)
        };
      }

        function taskListRequestActive() {

        }

        function shouldPauseTaskAutoRefresh() {
          return taskListLoading
            || taskListRequestActive()
            || Date.now() - taskManualActionAtRef.current < 8000
            || document.visibilityState === "hidden";
        }

        function taskListErrorMessage(error, fallback) {
          if (error?.code === "REQUEST_ABORTED") return "";
          if (error?.code === "REQUEST_TIMEOUT") return "任务记录刷新超时，请稍后再试。";
          return error?.message || fallback;
        }

        function taskPageQuery({
          page = 1,
          keyword = taskKeyword,
          accountId = taskAccountFilter,
          sourceChannelId = taskSourceChannelFilter,
          channel = taskChannelFilter,
          status = taskStatusFilter,
          kind = taskKind
        } = {}) {
          const normalized = {
            page: Math.max(1, numberValue(page) || 1),
            keyword: String(keyword || "").trim(),
            accountId: accountId || "all",
            sourceChannelId: sourceChannelId || "all",
            channel: channel || "all",
            status: status || "all",
            kind: ["image", "chat"].includes(kind) ? kind : "all"
          };
          const params = new URLSearchParams({ page: String(normalized.page), pageSize: "30" });
          if (normalized.keyword) params.set("keyword", normalized.keyword);
          if (normalized.accountId !== "all") params.set("accountId", normalized.accountId);
          if (normalized.sourceChannelId !== "all") params.set("sourceChannelId", normalized.sourceChannelId);
          if (normalized.channel !== "all") params.set("channel", normalized.channel);
          if (normalized.status !== "all") params.set("status", normalized.status);
          if (normalized.kind === "all") params.set("mixKinds", "1");
          else params.set("kind", normalized.kind);
          return {
            ...normalized,
            key: params.toString(),
            url: `/api/tasks/page?${params.toString()}`
          };
        }

        function applyTaskPageData(data, { append = false } = {}) {
          const items = Array.isArray(data?.items) ? data.items : [];
          setTasks((current) => {
            if (!append) return items;
            const seen = new Set();
            return [...current, ...items].filter((item) => {
              const id = String(item?.id || "");
              if (!id || seen.has(id)) return false;
              seen.add(id);
              return true;
            });
          });
          setTaskTotal(Math.max(0, numberValue(data?.total)));
          setTaskPage(Math.max(1, numberValue(data?.page) || 1));
          setAllTaskTotal(Math.max(0, numberValue(data?.allTotal)));
          setTaskKindTotals({
            image: Math.max(0, numberValue(data?.kindTotals?.image)),
            chat: Math.max(0, numberValue(data?.kindTotals?.chat))
          });
        }

        function invalidateTaskPageCache() {
          taskCacheRevisionRef.current += 1;
          taskPageCacheRef.current.clear();
          taskPrefetchRef.current.clear();
        }

        function cacheTaskPage(query, data, revision = taskCacheRevisionRef.current) {
          if (revision !== taskCacheRevisionRef.current) return;
          const cache = taskPageCacheRef.current;
          const items = Array.isArray(data?.items) ? data.items : [];
          cache.delete(query.key);
          cache.set(query.key, {
            data: { ...data, items },
            cachedAt: Date.now()
          });
          while (cache.size > 30) cache.delete(cache.keys().next().value);
        }

        function mergeTaskPageCache(updates) {
          const cache = taskPageCacheRef.current;
          for (const [key, entry] of cache.entries()) {
            const status = new URLSearchParams(key).get("status");
            if (status && status !== "all") {
              cache.delete(key);
              continue;
            }
            let changed = false;
            const items = (Array.isArray(entry?.data?.items) ? entry.data.items : []).map((task) => {
              const update = updates.get(String(task?.id || ""));
              if (!update) return task;
              changed = true;
              return { ...task, ...update };
            });
            if (changed) {
              cache.set(key, {
                ...entry,
                data: { ...entry.data, items }
              });
            }
          }
        }

        function prefetchTaskPage(query, { force = false } = {}) {
          const cached = taskPageCacheRef.current.get(query.key);
          if (!force && cached && Date.now() - cached.cachedAt < 30_000) {
            return Promise.resolve(cached.data);
          }
          const existing = taskPrefetchRef.current.get(query.key);
          if (existing) return existing;
          const revision = taskCacheRevisionRef.current;
          const request = api(query.url, { timeoutMs: 15_000 })
            .then((data) => {
              cacheTaskPage(query, data, revision);
              return data;
            })
            .finally(() => {
              if (taskPrefetchRef.current.get(query.key) === request) {
                taskPrefetchRef.current.delete(query.key);
              }
            });
          taskPrefetchRef.current.set(query.key, request);
          return request;
        }

        function prefetchOtherTaskKinds(query) {
          if (query.page !== 1) return;
          ["all", "image", "chat"]
            .filter((kind) => kind !== query.kind)
            .forEach((kind) => {
              prefetchTaskPage(taskPageQuery({ ...query, kind })).catch(() => {});
            });
        }

        function refreshCachedTaskPage(query) {
          prefetchTaskPage(query, { force: true })
            .then((data) => {
              if (taskVisibleQueryRef.current === query.key) applyTaskPageData(data);
            })
            .catch(() => {});
        }

        async function refreshRuntimeStatus() {
          const runtimeData = await api("/api/admin/runtime").catch(() => null);
          if (runtimeData) setRuntimeStatus(runtimeData);
          return runtimeData;

        function applyConfig(nextConfig) {
          if (!nextConfig) return false;
          const snapshot = JSON.stringify(nextConfig);
          if (snapshot === configSnapshotRef.current) return false;
          configSnapshotRef.current = snapshot;
          setConfig(nextConfig);
          return true;

        async function loadTaskPage({
          page = 1,
          append = false,
          keyword = taskKeyword,
          accountId = taskAccountFilter,
          sourceChannelId = taskSourceChannelFilter,
          channel = taskChannelFilter,
          status = taskStatusFilter,
          kind = taskKind,
          showLoading = true,
          background = false,
          preferCache = false,
          forceRefresh = false
        } = {}) {
          if (background && taskListRequestActive()) return null;
          const query = taskPageQuery({ page, keyword, accountId, sourceChannelId, channel, status, kind });
          const cacheRevision = taskCacheRevisionRef.current;
          if (!append) taskVisibleQueryRef.current = query.key;
          const requestId = ++taskRequestIdRef.current;
          if (!background && taskListRequestActive()) {
            taskPageAbortRef.current.abort();
            taskPageAbortRef.current = null;
          }

          const cached = !append && preferCache && !forceRefresh
            ? taskPageCacheRef.current.get(query.key)
            : null;
          if (cached) {
            applyTaskPageData(cached.data);
            setTaskListLoading(false);
            prefetchOtherTaskKinds(query);
            if (Date.now() - cached.cachedAt >= 30_000) refreshCachedTaskPage(query);
            return cached.data;
          }

          const controller = new AbortController();
          taskPageAbortRef.current = controller;
          if (showLoading) setTaskListLoading(true);
          try {
            const prefetched = taskPrefetchRef.current.get(query.key);
            const data = prefetched
              ? await prefetched
              : await api(query.url, {
                  signal: controller.signal,
                  timeoutMs: background ? 8000 : 15000
                });
            if (controller.signal.aborted || requestId !== taskRequestIdRef.current) return null;
            cacheTaskPage(query, data, cacheRevision);
            applyTaskPageData(data, { append });
            if (!append) prefetchOtherTaskKinds(query);
            return data;
          } catch (error) {
            if (error?.code === "REQUEST_ABORTED") return null;
            throw error;
          } finally {
            if (taskPageAbortRef.current === controller) taskPageAbortRef.current = null;
            if (showLoading && requestId === taskRequestIdRef.current) setTaskListLoading(false);
          }
        }

            setUpstreamLoadingTaskId("");
          }
        }

        function mergeRefreshedTasks(results = []) {

            .map((task) => [String(task.id), task]));
          if (!updates.size) return;
          mergeTaskPageCache(updates);

        async function handleTaskSearch(value) {
          const keyword = String(value || "").trim();
          markTaskListInteraction();
          setTaskKeyword(keyword);
          setTaskSearchLoading(true);
          try {
            const data = await loadTaskPage({ page: 1, keyword, preferCache: true });
            if (!data) return;

            if (numberValue(data.total) > 0) {

        function normalizeChannelFormValues(values = {}) {
          const payload = {
            ...values,
            settings: {
              ...(values.settings || {})
            }
          };
          if (payload.type !== "shareai") return payload;

          const enabledAbilities = shareAIAbilityDefaults(payload.settings);
          payload.settings.enabledAbilities = enabledAbilities;
          delete payload.settings.imageSourcePriority;
          payload.settings.geminiDrawingModelId = [2, 3].includes(Number(payload.settings.geminiDrawingModelId))
            ? Number(payload.settings.geminiDrawingModelId)
            : 2;
          const drawingBaseUrl = String(payload.settings.drawingBaseUrl || "").trim();
          const chatBaseUrl = String(payload.settings.chatBaseUrl || "").trim();
          const rawProtection = payload.settings.quotaProtection || {};
          if (
            rawProtection.enabled === true
            && rawProtection.mode === "random"
            && Number(rawProtection.randomMinPercent) > Number(rawProtection.randomMaxPercent)
          ) {
            message.error("随机范围的最小值不能大于最大值");
            return null;
          }
          payload.settings.quotaProtection = quotaProtectionSettings(rawProtection);

          if (!enabledAbilities.drawing && !enabledAbilities.chatplus) {
            message.error("请至少启用绘图站或聊天站");
            return null;
          }
          if (enabledAbilities.drawing && !drawingBaseUrl) {
            message.error("启用绘图站时需要填写绘图站地址");
            return null;
          }
          if (enabledAbilities.chatplus && !chatBaseUrl) {
            message.error("启用聊天站时需要填写聊天站地址");
            return null;
          }
          payload.settings.drawingBaseUrl = drawingBaseUrl;
          payload.settings.chatBaseUrl = chatBaseUrl;
          return payload;
        }

        function updateBatchRenewalAccount(rowId, accountId) {
          setBatchRenewalRows((current) => {
            const source = current.find((row) => row.rowId === rowId);
            const occupied = current.find((row) => row.rowId !== rowId && row.accountId === accountId);
            return current.map((row) => {
              if (row.rowId === rowId) return { ...row, accountId, status: "valid", message: "等待续费" };
              if (occupied && row.rowId === occupied.rowId && source?.accountId) {
                return { ...row, accountId: source.accountId, status: "valid", message: "等待续费" };
              }
              return row;
            });
          });
        }

        function batchRenewalCanSubmit() {
          if (!batchRenewalRows.length || batchRenewalFinished) return false;
          const accountIds = batchRenewalRows.map((row) => row.accountId).filter(Boolean);
          return batchRenewalRows.every((row) => row.status === "valid" && row.accountId)
            && new Set(accountIds).size === accountIds.length;
        }

        async function submitBatchRenewals() {
          if (!selectedChannel?.id || batchRenewing) return;
          if (!batchRenewalRows.length) {
            previewBatchRenewals();
            return;
          }
          if (!batchRenewalCanSubmit()) {
            message.warning("请先处理预览中的重复或未分配项目");
            return;

          setBatchRenewing(true);
          try {
            const response = await api(`/api/channels/${encodeURIComponent(selectedChannel.id)}/accounts/activate-batch`, {
              method: "POST",

                rows: batchRenewalRows.map((row) => ({

            applyConfig(response.config);

            const result = response.result || {};
            const completedById = new Map((result.results || []).map((row) => [String(row.rowId), row]));
            setBatchRenewalRows((current) => current.map((row) => ({
              ...row,
              ...(completedById.get(String(row.rowId)) || {})
            })));
            setBatchRenewalFinished(true);
            const summary = result.summary || {};
            if (summary.failed || summary.pending) {
              message.warning(`续费完成：成功 ${summary.success || 0} 个，待确认 ${summary.pending || 0} 个，失败 ${summary.failed || 0} 个`);

          } finally {
            setBatchRenewing(false);

        async function submitProxyAssignments() {
          if (!proxyAssignPreview || proxyAssignSaving) return;
          setProxyAssignSaving(true);
          try {
            const response = await api("/api/accounts/proxies/apply", {
              method: "POST",
              body: {
                channelIds: proxyAssignPreview.channelIds,
                proxies: proxyAssignPreview.proxies,
                targetType: proxyAssignPreview.targetType,
                allowReuse: proxyAssignPreview.allowReuse,
                snapshot: proxyAssignPreview.snapshot,
                assignments: proxyAssignPreview.rows.map((row) => ({
                  accountId: row.accountId,
                  channelId: row.channelId,
                  proxyUrl: row.proxyUrl || ""
                }))
              }
            });
            applyConfig(response.config);
            setProxyAssignOpen(false);
            setProxyAssignPreview(null);
            await refreshRuntimeStatus();
            const result = response.result || {};
            message.success(`代理分配已应用：已修改 ${result.changed || 0} 个账号`);
          } catch (error) {
            if (String(error.message || "").includes("重新预览")) setProxyAssignPreview(null);
            message.error(error.message);
          } finally {
            setProxyAssignSaving(false);
          }
        }

          const snapshot = scopedAccounts.map((account) => ({

            enabled: account.enabled !== false
          }));

            title: "确认清除所选渠道的全部代理 IP？",
            content: `将清除 ${proxyCount} 个账号的代理 IP，之后这些账号会使用服务器 IP。此操作不能自动恢复。`,

                  method: "POST",
                  body: { channelIds: selectedChannelIds, snapshot }

                setProxyAssignOpen(false);
                setProxyAssignPreview(null);
                await refreshRuntimeStatus();
                message.success(`已清除 ${response.result?.cleared || 0} 个账号的代理 IP`);

            await refresh();
            if (result?.checkSkipped) message.info(result.message || "账号使用中，本次检测已跳过");
            else message.success("检测完成");
          } catch (error) {

        async function testChannel(channelId) {
          const related = accounts.filter((item) => item.channelId === channelId);
          if (!related.length) {
            message.warning("这个渠道还没有绑定账号");
            return;
          }
          setCheckingChannelIds((current) => current.includes(channelId) ? current : [...current, channelId]);
          let ok = 0;
          let failed = 0;
          let skipped = 0;
          let nextIndex = 0;
          async function worker() {
            while (nextIndex < related.length) {
              const account = related[nextIndex];
              nextIndex += 1;
              try {
                const result = await api(`/api/accounts/${account.id}/test`, { method: "POST" });
                if (result?.checkSkipped) skipped += 1;
                else ok += 1;
              } catch (_error) {
                failed += 1;
              }
            }
          }
          await Promise.all(Array.from({ length: Math.min(3, related.length) }, () => worker()));
          await refresh().catch(() => {});
          setCheckingChannelIds((current) => current.filter((item) => item !== channelId));
          message.info(`检测完成：${ok} 个完成，${skipped} 个使用中已跳过，${failed} 个需处理`);
        }

        async function testAll() {
          setCheckingAll(true);
          try {
            const results = await api("/api/accounts/test-all", { method: "POST" });
            await refresh();
            const skipped = Array.isArray(results) ? results.filter((item) => item?.data?.checkSkipped || item?.skipped).length : 0;
            message.success(skipped ? `检测完成，${skipped} 个使用中账号已跳过` : "全部账号检测完成");
          } catch (error) {
            await refresh().catch(() => {});
            message.error(error.message);
          } finally {
            setCheckingAll(false);
          }
        }

        function showUpdateResult(result) {

          const output = [
            result?.message ? `结果：${result.message}` : "",
            result?.stdout ? `输出：\n${result.stdout}` : "",
            result?.stderr ? `提示：\n${result.stderr}` : ""
          ].filter(Boolean).join("\n\n") || "更新命令执行完成，没有返回内容。";
          Modal.info({
            title,
            width: 760,
            okText: "知道了",
            content: h("pre", { className: "update-output" }, output)
          });
        }

        const updateMessageKey = "admin-code-update";

        function wait(milliseconds) {
          return new Promise((resolve) => setTimeout(resolve, milliseconds));
        }

        async function waitForServerRecovery() {
          for (let attempt = 0; attempt < 45; attempt += 1) {
            const ready = await withTimeout(
              fetch("/api/health", { cache: "no-store" }).then((response) => response.ok),
              2000,
              false
            );
            if (ready) {
              message.success({ key: updateMessageKey, content: "服务器已恢复，正在刷新页面", duration: 2 });
              setTimeout(() => window.location.reload(), 600);
              return true;
            }
            await wait(2000);
          }
          message.warning({ key: updateMessageKey, content: "服务器暂未恢复，请稍后手动刷新页面", duration: 6 });
          return false;
        }

        async function executeUpdate() {
          setUpdating(true);
          message.loading({ key: updateMessageKey, content: "正在后台检查更新，可继续使用页面", duration: 0 });
          try {
            const result = await api("/api/admin/update", { method: "POST", body: {}, timeoutMs: 210000 });
            if (result?.success && !result?.skipped) {
              message.loading({ key: updateMessageKey, content: "更新完成，正在等待服务器重启", duration: 0 });
              await wait(2500);
              await waitForServerRecovery();
              return;
            }
            if (result?.success) message.info({ key: updateMessageKey, content: result?.message || "已经是最新版，无需更新", duration: 4 });
            else if (result?.skipped) message.warning({ key: updateMessageKey, content: result?.message || "未执行更新", duration: 5 });
            else message.error({ key: updateMessageKey, content: result?.message || "更新失败", duration: 5 });
            showUpdateResult(result);
          } catch (error) {
            if (error?.code === "NETWORK_ERROR") {
              message.loading({ key: updateMessageKey, content: "服务器正在重启，正在自动重新连接", duration: 0 });
              await waitForServerRecovery();
            } else if (error?.code === "REQUEST_TIMEOUT") {
              message.warning({ key: updateMessageKey, content: error.message, duration: 8 });
            } else {
              message.error({ key: updateMessageKey, content: error.message, duration: 6 });
            }
          } finally {
            setUpdating(false);
          }
        }

        function accountExpiryContent(row, rowChannel, now = Date.now()) {
          const text = accountExpireText(row, rowChannel);
          let displayText = text;
          let detail = "";
          let tone = "normal";

          if (text === "-" || !text) {
            displayText = "未提供";
            detail = "暂未获取到期时间";
          } else if (text.includes("过期")) {
            tone = "expired";
            detail = "请及时续期";
          } else if (text === "未订阅") {
            tone = "expired";
            detail = "激活后显示到期时间";
          } else {
            const match = text.match(/^(\d{4})-(\d{2})-(\d{2}),?\s+(\d{2}):(\d{2})$/);
            const expireTime = match
              ? Date.parse(`${match[1]}-${match[2]}-${match[3]}T${match[4]}:${match[5]}:00+08:00`)
              : Number.NaN;
            if (Number.isFinite(expireTime)) {
              const remainingMs = expireTime - now;
              if (remainingMs <= 0) {
                displayText = "已过期";
                detail = "请及时续期";
                tone = "expired";
              } else if (remainingMs <= 24 * 60 * 60 * 1000) {
                detail = "24 小时内到期";
                tone = "warning";
              } else {
                detail = `剩余 ${Math.ceil(remainingMs / (24 * 60 * 60 * 1000))} 天`;
              }
            }
          }

          return h("div", { className: `account-expiry is-${tone}` }, [
            h("strong", { key: "date" }, displayText),
            detail ? h("span", { key: "detail" }, detail) : null
          ].filter(Boolean));
        }

            h("div", { className: "section-title" }, h("h3", null, "并发设置")),
            h("div", { className: "form-grid" }, [
              accountModalChatEnabled
                ? h(Form.Item, {
                    label: "聊天 + 聊天生图总并发",
                    name: ["concurrency", "chat"],
                    extra: "固定为 1；账号忙时立即返回，不排队。"
                  }, h(InputNumber, { min: 1, max: 1, disabled: true, style: { width: "100%" } }))
                : null,
              accountModalDrawingEnabled
                ? h(Form.Item, {
                    label: "绘图站并发",
                    name: ["concurrency", "drawingImage"],
                    rules: [{ required: true, message: "请输入绘图站并发" }]
                  }, h(InputNumber, { min: 1, max: 20, style: { width: "100%" } }))
                : null,
              null
            ]),
            h(Alert, {
              type: "info",
              showIcon: true,
              message: "普通聊天和聊天生图共用一个名额，忙时立即返回，不排队；绘图站并发单独计算。",
              style: { marginBottom: 0 }
            })
          ])),
          h(Modal, {
            title: "批量导入账号",
            open: accountImportOpen,
            onCancel: () => {
              if (!accountImporting) setAccountImportOpen(false);
            },
            onOk: submitAccountImport,
            okText: `导入 ${accountImportRows.filter((row) => row.status === "valid").length} 个账号`,
            okButtonProps: {
              disabled: Boolean(accountImportError) || !accountImportRows.some((row) => row.status === "valid")
            },
            cancelText: "取消",
            confirmLoading: accountImporting,
            maskClosable: !accountImporting,
            width: 920,
            destroyOnClose: true
          }, [
            h(Alert, {
              key: "notice",
              type: "info",
              showIcon: true,
              message: `导入到“${selectedChannel?.name || ""}”`,
              description: "支持 CSV；也可每行按空格填写“登录账号 密码 代理 IP”。账号名称和代理 IP 都可以不填。",
              style: { marginBottom: 14 }
            }),
            h(Space, { key: "actions", size: 8, wrap: true, style: { marginBottom: 12 } }, [
              h(Upload, {
                accept: ".csv,.txt,text/csv,text/plain",
                beforeUpload: readAccountImportFile,
                showUploadList: false,
                maxCount: 1
              }, h(Button, { icon: Icon.UploadOutlined ? h(Icon.UploadOutlined) : null }, "选择 CSV 文件")),
              h(Button, { onClick: downloadAccountImportTemplate, icon: Icon.DownloadOutlined ? h(Icon.DownloadOutlined) : null }, "下载模板"),
              h(Button, { type: "primary", ghost: true, onClick: () => previewAccountImport() }, "预览内容")
            ]),
            h(Input.TextArea, {
              key: "text",
              value: accountImportText,
              onChange: (event) => {
                setAccountImportText(event.target.value);
                setAccountImportRows([]);
                setAccountImportError("");
              },
              rows: 6,
              placeholder: "每行一个账号，例如：name@example.com password proxy.example.com|1080|user|password",
              style: { marginBottom: 12 }
            }),
            accountImportError
              ? h(Alert, { key: "error", type: "error", showIcon: true, message: accountImportError, style: { marginBottom: 12 } })
              : null,
            accountImportRows.length
              ? h("div", { key: "preview" }, [
                  h(Space, { size: 6, wrap: true, style: { marginBottom: 10 } }, [
                    h(Tag, { color: "green" }, `可导入 ${accountImportRows.filter((row) => row.status === "valid").length}`),
                    h(Tag, null, `重复 ${accountImportRows.filter((row) => row.status === "duplicate").length}`),
                    h(Tag, { color: "red" }, `错误 ${accountImportRows.filter((row) => row.status === "error").length}`)
                  ]),
                  h(Table, {
                    rowKey: "key",
                    size: "small",
                    pagination: accountImportRows.length > 6 ? { pageSize: 6, showSizeChanger: false } : false,
                    scroll: { x: 720 },
                    dataSource: accountImportRows,
                    columns: [
                      { title: "行", dataIndex: "rowNumber", width: 64 },
                      { title: "账号名称", dataIndex: "name", width: 150, ellipsis: true },
                      { title: "登录账号", dataIndex: "username", width: 210, ellipsis: true },
                      { title: "代理 IP", dataIndex: "proxyUrl", width: 180, render: accountImportProxyLabel },
                      {
                        title: "结果",
                        dataIndex: "status",
                        width: 210,
                        render: (_value, row) => row.status === "valid"
                          ? h(Tag, { color: "green" }, "可导入")
                          : row.status === "duplicate"
                            ? h(Tag, null, "重复，已跳过")
                            : h(Tag, { color: "red" }, row.message || "格式错误")
                      }
                    ]
                  })
                ])
              : null
          ]),
          renderBatchRenewalModal(),
          renderProxyAssignModal()
        ]);
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        h(ConfigProvider, {
          theme: {
            token: {
              colorPrimary: "#1677ff",
              borderRadius: 8,
              colorBgLayout: "#f4f6f8",
              fontFamily: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif"
            },
            components: {
              Button: { controlHeight: 34 },
              Input: { controlHeight: 34 },
              Menu: {
                darkItemBg: "#111827",
                darkSubMenuItemBg: "#111827",
                darkItemColor: "#d0d5dd",
                darkGroupTitleColor: "#98a2b3",
                darkItemHoverBg: "rgba(255, 255, 255, 0.08)",
                darkItemSelectedBg: "#1677ff",
                darkItemSelectedColor: "#ffffff",
                itemBorderRadius: 7,
                itemHeight: 42,
                itemMarginInline: 0
              },
              Select: { controlHeight: 34 },
              Table: { headerBg: "#f8fafc", rowHoverBg: "#f5f9ff" }
            }
          }
        }, h(App))
      );
    </script>
  </body>
</html>
